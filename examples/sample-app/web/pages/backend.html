<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

<body data-page="backend">
  <header class="site-header">
    <div class="bar">

    <h1>Backend logs demo</h1>
    <p class="lead">Each button calls an API endpoint whose server-side logs ride back on the <code>X-Piwi-Logs</code> response header.</p>
    <div class="card">
      <div class="actions">
        <button type="button" class="primary" data-testid="load-report">Load report</button>
        <button type="button" class="danger" data-testid="trigger-failure">Trigger backend failure</button>
      </div>
      <p id="backend-result" class="message" role="status"></p>
    </div>
  </main>
