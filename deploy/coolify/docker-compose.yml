# Generated by apps/application/scripts/generate-deploy-manifests.mjs — edit the script, not this file.
# Piwi Dashboard — one-click deploy. Docs: https://piwitests.dev/operate/one-click-deploy
# Tracks :latest. Pin a version tag before you rely on it — migrations are forward-only.

services:
  piwi:
    image: phenx/piwitests-server:latest
    environment:
      - SERVICE_FQDN_PIWI_3000
      # A one-click deploy is reachable from the internet — authentication stays on.
      - PIWI_AUTH_ENABLED=true
      - PIWI_AUTH_SECRET=${SERVICE_PASSWORD_64_PIWIAUTHSECRET}
      - PIWI_SECRET_KEY=${SERVICE_PASSWORD_64_PIWISECRETKEY}
      # The first-admin form asks for this value, so only you can create the administrator.
      - PIWI_SETUP_TOKEN=${SERVICE_PASSWORD_64_PIWISETUPTOKEN}
      - PIWI_SITE_URL=${SERVICE_FQDN_PIWI_3000}
    volumes:
      - piwi-data:/app/.data
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  piwi-data:
