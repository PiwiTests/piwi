# Generated by apps/application/scripts/generate-deploy-manifests.mjs — edit the script, not this file.
# Piwi Dashboard — one-click deploy. Docs: https://piwitests.dev/operate/one-click-deploy
# Tracks :latest. Pin a version tag before you rely on it — migrations are forward-only.

app = "piwi"
primary_region = "cdg"

[build]
  image = "phenx/piwitests-server:latest"

[env]
  # A one-click deploy is reachable from the internet — authentication stays on.
  PIWI_AUTH_ENABLED = "true"
  # PIWI_SITE_URL defaults to https://<app>.fly.dev, from the app's name; set it for a custom domain.

[mounts]
  source = "piwi_data"
  destination = "/app/.data"
  initial_size = "10gb"

[http_service]
  internal_port = 3000
  force_https = true
  # One always-on machine: SQLite, the SSE bus and the cron sweeps are all in-process.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# Secrets are never committed to fly.toml. Set them once, after `fly launch --no-deploy`:
#
#   fly secrets set PIWI_AUTH_SECRET=$(openssl rand -hex 32) \
#     PIWI_SECRET_KEY=$(openssl rand -hex 32) \
#     PIWI_SETUP_TOKEN=$(openssl rand -hex 32)
#
# PIWI_SETUP_TOKEN: The first-admin form asks for this value, so only you can create the administrator.
# Read it back with: fly ssh console -C "printenv PIWI_SETUP_TOKEN"
