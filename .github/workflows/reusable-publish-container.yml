name: Publish container image

# The multi-arch server image. On a release tag it pushes the version tag to GHCR
# and Docker Hub (release.yml calls it), and the minor, major and `latest` tags
# only when the tag is the newest release of that line, so publishing an older
# tag again never moves them back; on main it pushes `edge` to GHCR (edge.yml);
# anywhere else it builds both architectures and pushes nothing.
on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # The GHCR image name is fixed and lowercase (registry refs and the BuildKit
  # registry cache require it): users pull it by this name, so it never follows
  # the repository's name.
  IMAGE_NAME: piwitests/platform
  PUSH: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}

jobs:
  # Build each architecture on its own NATIVE runner and push it by digest.
  # Building linux/arm64 on a native arm runner (instead of QEMU emulation on an
  # amd64 runner) is the main speed-up: the heavy npm ci + nuxt build no longer
  # runs under emulation. The two arches run in parallel; the `merge` job below
  # stitches the pushed digests into a single multi-arch manifest list.
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm  # GitHub-hosted native ARM; free for public repos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare build variables
        # linux/amd64 -> linux-amd64 (artifact names + cache scope).
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PIWI_BUILD_SHA=${{ github.sha }}
          # Registry cache is NOT branch-scoped (unlike type=gha), so release (v*)
          # builds reuse the layers cached by main/edge builds. Per-arch ref keeps
          # the two matrix legs from clobbering each other.
          # A build that pushes nothing reads the cache and writes none.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: ${{ env.PUSH == 'true' && format('type=registry,ref={0}/{1}:buildcache-{2},mode=max', env.REGISTRY, env.IMAGE_NAME, env.PLATFORM_PAIR) || '' }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}

      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-arch digests pushed by the `build` matrix into one multi-arch
  # manifest list per registry. imagetools reads the arch manifests from GHCR and
  # (for Docker Hub) copies them across, so nothing is rebuilt or re-emulated here.
  # The linux/amd64 image is started and asked for /api/health first: a tag moves
  # only to an image that answers.
  merge:
    name: merge
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout the shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Download the linux/amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-linux-amd64
          path: ${{ runner.temp }}/digest-amd64

      - name: Pull the linux/amd64 image
        id: amd64
        run: |
          image="${{ env.REGISTRY }}/${IMAGE_NAME}@sha256:$(ls "$RUNNER_TEMP/digest-amd64")"
          docker pull "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Check the image answers
        uses: ./.github/actions/container-health
        with:
          image: ${{ steps.amd64.outputs.image }}

      # The minor, major and `latest` tags follow the newest release of their
      # line (x.y.*, x.*.*, every release), among the plain vX.Y.Z tags.
      - name: Read which lines this tag is the newest release of
        id: newest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          refs=$(gh api "repos/$REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref | ltrimstr("refs/tags/")')
          releases=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$refs" || true)
          newest() { grep -E "^$1" <<< "$releases" | sort -V | tail -n 1; }
          latest=false; major=false; minor=false
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            [[ "$(newest 'v')" == "$TAG" ]] && latest=true
            [[ "$(newest "v${BASH_REMATCH[1]}\.")" == "$TAG" ]] && major=true
            [[ "$(newest "v${BASH_REMATCH[1]}\.${BASH_REMATCH[2]}\.")" == "$TAG" ]] && minor=true
          fi
          echo "latest=$latest major=$major minor=$minor"
          { echo "latest=$latest"; echo "major=$major"; echo "minor=$minor"; } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for GHCR
        id: meta-ghcr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.newest.outputs.minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.newest.outputs.major == 'true' }}
            type=raw,value=latest,enable=${{ steps.newest.outputs.latest == 'true' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create and push manifest list to GHCR
        working-directory: ${{ runner.temp }}/digests
        run: |
          # The tags and the digests are split into one argument each.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Extract metadata for Docker Hub
        id: meta-dockerhub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/phenx/piwitests-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.newest.outputs.minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.newest.outputs.major == 'true' }}
            type=raw,value=latest,enable=${{ steps.newest.outputs.latest == 'true' }}

      - name: Create and push manifest list to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ runner.temp }}/digests
        run: |
          # The tags and the digests are split into one argument each.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect and capture digest
        id: inspect
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta-ghcr.outputs.version }}"
          docker buildx imagetools inspect "$REF"
          echo "digest=$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          IS_RELEASE="${{ startsWith(github.ref, 'refs/tags/v') }}"
          PRIMARY_TAG="${{ steps.meta-ghcr.outputs.version }}"
          echo "## Container Image Published :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Registries" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Container Registry**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "- **Docker Hub**: \`phenx/piwitests-server\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms**: \`linux/amd64\`, \`linux/arm64\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          TAGS="${{ steps.meta-ghcr.outputs.tags }}"
          if [[ "$IS_RELEASE" == "true" ]]; then
            TAGS="${TAGS}"$'\n'"${{ steps.meta-dockerhub.outputs.tags }}"
          fi
          echo "$TAGS" | while read -r tag; do
            [[ -n "$tag" ]] && echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image digest: \`${{ steps.inspect.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull from GHCR" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${PRIMARY_TAG}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Pull from Docker Hub" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "docker pull phenx/piwitests-server:${PRIMARY_TAG}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Run the container" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker run -p 127.0.0.1:3000:3000 -v \$(pwd)/.data:/app/.data ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${PRIMARY_TAG}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
