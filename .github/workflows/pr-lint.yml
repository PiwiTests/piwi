name: PR lint

# The commits of a pull request, its title and the workflows. Every job runs on every event, so each check's latest
# run on a commit is a real one: a job skipped on some events would read as passed over a failure of the same name.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # commitlint needs no install script: the workspaces' builds and `nuxt prepare` are skipped.
      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          ignore-scripts: 'true'

      - name: Lint the commits of the pull request
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  # The title becomes the commit subject on main when a pull request is squash-merged, so it follows
  # commitlint.config.js like every commit, without commitlint's default ignores (merges, reverts, fixups, bare
  # versions).
  title:
    name: title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node alone: the lint step installs the packages commitlint.config.js loads.
      - name: Set up Node
        uses: ./.github/actions/setup-workspace
        with:
          install: 'false'

      # Dependabot titles its pull requests itself, a capitalized "Bump" included: a pull request it opened, or one
      # labelled `dependencies`, is not linted. The labels are the event's, so adding the label runs the job again.
      # scripts/commitlint-title.mjs writes, outside the workspace, a manifest of the packages commitlint.config.js
      # loads, a lockfile of their dependencies cut from package-lock.json, and a title config that loads the repository's.
      - name: Lint the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          DEPENDENCIES: ${{ github.event.pull_request.user.login == 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'dependencies') }}
        run: |
          if [ "$DEPENDENCIES" = "true" ]; then
            echo "A Dependabot pull request: the title is not linted."
            exit 0
          fi
          dir="$RUNNER_TEMP/commitlint"
          node scripts/commitlint-title.mjs "$dir"
          npm ci --prefix "$dir" --ignore-scripts --prefer-offline --no-audit --fund=false
          printf '%s\n' "$TITLE" | "$dir/node_modules/.bin/commitlint" --config "$dir/title.config.mjs" --verbose

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # shellcheck reports warnings and errors in the `run` scripts; its info and style notes are left out.
      - name: Lint the workflows and actions
        run: docker run --rm -v "$PWD:/repo" -w /repo -e SHELLCHECK_OPTS=--severity=warning rhysd/actionlint:1.7.12 -color
