name: Publish desktop installers

# Builds the Tauri desktop app (Windows .msi + .exe + macOS .dmg + Linux .deb/.rpm/.AppImage)
# and attaches the installers to the GitHub Release release-please created for the
# tag, so they publish alongside the container image and the npm packages
# (release.yml calls it). The Windows .exe is the NSIS installer in per-user mode
# (no admin prompt); the .msi installs per machine and needs elevation. Off a tag
# it builds the installers and keeps them as the run's artifacts.
on:
  workflow_call:
    inputs:
      server-artifact:
        description: >-
          Artifact of the calling run holding apps/application/.output, built on Linux
          with the node-server preset. The output is pure JS; stage-server.mjs adds
          each OS's native modules.
        type: string
        required: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  # Match the runtime the app is built and tested against (apps/application/engines).
  PIWI_NODE_VERSION: 24.22.1

jobs:
  desktop:
    name: desktop (${{ matrix.target }}, ${{ matrix.bundles }})
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: write # upload installers to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Per-machine installer (into Program Files, so it needs admin). It
          # owns the default updater channel (latest.json), which every existing
          # install already points at, so this leg stays exactly as before.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
            updaterConfig: src-tauri/tauri.updater.conf.json
          # Per-user installer (into %LOCALAPPDATA%, installMode "currentUser",
          # so no admin prompt to install OR to update). It updates from its own
          # manifest (latest-nsis.json, published by the step near the end), so a
          # per-user install pulls a per-user update and never the .msi. The
          # tauri-action step sets uploadUpdaterJson false for this leg so it
          # leaves the shared latest.json (the .msi channel) untouched.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            updaterConfig: src-tauri/tauri.updater.nsis.conf.json
          # `app` alongside the dmg: the bundler makes the macOS update bundle
          # (.app.tar.gz, the darwin entry of latest.json) from the app bundle
          # only, never from the dmg.
          - runner: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            updaterConfig: src-tauri/tauri.updater.conf.json
          # Ubuntu 22.04 (not latest): AppImage bundles the host's glibc, so
          # building on the oldest supported runner keeps the installer usable on
          # older distros. 22.04 is also the last runner carrying webkit2gtk-4.1.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            updaterConfig: src-tauri/tauri.updater.conf.json
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          install: 'false'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Tauri's Linux prerequisites: WebKitGTK for the webview, appindicator for
      # the tray icon, librsvg for the icons, patchelf for the AppImage. The last
      # two the AppImage bundler shells out to: xdg-utils (xdg-open) which it
      # copies in for the opener, and squashfs-tools (mksquashfs) to pack the image.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            xdg-utils \
            squashfs-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install desktop tooling
        working-directory: apps/desktop
        run: npm install

      - name: Download server bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.server-artifact }}
          path: apps/application/.output

      - name: Fetch Node sidecar
        working-directory: apps/desktop
        run: node scripts/fetch-node.mjs --target ${{ matrix.target }} --node ${{ env.PIWI_NODE_VERSION }}

      - name: Stage server (native modules for this OS)
        working-directory: apps/desktop
        run: node scripts/stage-server.mjs

      - name: Generate app icons
        working-directory: apps/desktop
        run: npx tauri icon ../application/public/logo.svg

      - name: Build & release desktop app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Linux AppImage bundling runs linuxdeploy (and its plugins), each a
          # self-mounting AppImage. GitHub runners have no libfuse2, so mounting
          # fails with "failed to run linuxdeploy"; extract-and-run unpacks the
          # tools to a temp dir instead. No-op on Windows/macOS.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # macOS is signed ad hoc (bundle.macOS.signingIdentity "-" in
          # tauri.conf.json): no Apple Developer ID, so a first launch still
          # asks for Open Anyway in System Settings. Passing an invalid or
          # placeholder APPLE_CERTIFICATE secret makes tauri-action fail at
          # `security import`. To sign with a Developer ID and notarize, add the
          # secrets and the APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
          # APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID env
          # here; APPLE_SIGNING_IDENTITY takes the place of the ad-hoc identity.
          #
          # In-app updates are opt-in and OFF until the updater keypair exists.
          # To enable them: run `npx tauri signer generate` locally, put the
          # public key into BOTH src-tauri/tauri.updater.conf.json (the .msi
          # channel) and src-tauri/tauri.updater.nsis.conf.json (the .exe
          # channel), and add the private key (+ its password) as the two secrets
          # below. Each leg's overlay (matrix.updaterConfig) is applied only when
          # the secret is present, so releases without it build exactly as
          # before, installers with no update artifacts and apps that report
          # updates as unsupported. The key reaches a release tag's build only.
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          projectPath: apps/desktop
          # Retry a failed asset upload. Uploading the installers to the release
          # intermittently times out ("Error saving asset"), and with the updater
          # enabled each job pushes more/larger assets, so one flaky upload fails
          # the whole leg. This re-tries the upload instead.
          retryAttempts: 3
          # The .exe (nsis) leg owns a separate manifest (latest-nsis.json), so
          # it must NOT write the shared latest.json, the step near the end
          # publishes its manifest instead. Every other leg keeps the default.
          uploadUpdaterJson: ${{ matrix.bundles == 'nsis' && 'false' || 'true' }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY != '' && format('--config {0}', matrix.updaterConfig) || '' }}
          # Attach to the release release-please already made for this tag. On a
          # manual dispatch (no tag) tagName is empty, so tauri-action just builds.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      # The macOS app must carry a signature that seals the whole bundle, or
      # Gatekeeper reports a downloaded copy as damaged, and the Node sidecar
      # the bundler re-signed must still run the server: start it from the
      # bundle, as the shell does on launch, and wait for /api/health.
      - name: Check the macOS app bundle
        if: runner.os == 'macOS'
        working-directory: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos
        run: |
          app="Piwi Dashboard.app"
          codesign --verify --strict --verbose=2 "$app"
          codesign --display --entitlements - "$app/Contents/MacOS/node"
          data="$(mktemp -d)"
          mkdir -p "$data/storage"
          NODE_ENV=production NITRO_HOST=127.0.0.1 NITRO_PORT=3917 \
            PIWI_DATABASE_PATH="$data/piwi.db" PIWI_STORAGE_PATH="$data/storage" \
            PIWI_SECRET_KEY="$(openssl rand -hex 32)" PIWI_DESKTOP_TOKEN="pd_$(openssl rand -hex 32)" \
            NUXT_PUBLIC_DESKTOP=true \
            "$app/Contents/MacOS/node" "$app/Contents/Resources/resources/app-server/.output/server/index.mjs" \
            > "$data/server.log" 2>&1 &
          server=$!
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3917/api/health > /dev/null 2>&1; then
              kill "$server"
              echo "The bundled server answered /api/health"
              exit 0
            fi
            kill -0 "$server" 2>/dev/null || break
            sleep 1
          done
          cat "$data/server.log"
          kill "$server" 2>/dev/null || true
          echo "::error::The bundled server did not answer /api/health"
          exit 1

      # Publish the per-user (.exe) updater manifest. tauri-action uploaded the
      # NSIS -setup.exe and its .sig but not a JSON (uploadUpdaterJson is false
      # for that leg), so the shared latest.json stays the .msi channel. This
      # writes latest-nsis.json pointing at the -setup.exe, which the .exe build
      # reads from tauri.updater.nsis.conf.json, so a per-user install updates
      # itself per-user, with no admin prompt. Skips itself on keyless builds
      # (no .sig produced), matching the .msi channel's "updates unsupported".
      - name: Publish NSIS updater manifest (latest-nsis.json)
        if: ${{ matrix.bundles == 'nsis' && startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.replace('refs/tags/', '');
            const bundleDir = path.join(
              'apps/desktop/src-tauri/target', '${{ matrix.target }}', 'release/bundle/nsis',
            );
            const sig = fs.existsSync(bundleDir)
              ? fs.readdirSync(bundleDir).find((f) => f.endsWith('-setup.exe.sig'))
              : undefined;
            if (!sig) {
              core.info('No NSIS updater signature (updater key absent); skipping latest-nsis.json');
              return;
            }
            const signature = fs.readFileSync(path.join(bundleDir, sig), 'utf8');
            const { owner, repo } = context.repo;
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const setup = release.data.assets.find((a) => a.name.endsWith('-setup.exe'));
            if (!setup) throw new Error('tauri-action did not upload the NSIS -setup.exe');
            const manifest = {
              version: tag.replace(/^v/, ''),
              pub_date: new Date().toISOString(),
              platforms: { 'windows-x86_64': { signature, url: setup.browser_download_url } },
            };
            const name = 'latest-nsis.json';
            const prior = release.data.assets.find((a) => a.name === name);
            if (prior) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: prior.id });
            }
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: release.data.id, name,
              data: JSON.stringify(manifest, null, 2),
            });
            core.info(`Published ${name} -> ${setup.browser_download_url}`);

      # Dry-run only: make the built installers downloadable as a workflow artifact
      # (they are not attached to any release unless this was a tag build). The
      # two Windows legs share a target triple, so the bundle set goes in the
      # artifact name to keep them from colliding.
      - name: Upload installers (dry-run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piwi-desktop-${{ matrix.target }}-${{ matrix.bundles }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*-setup.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: warn
          retention-days: 7
