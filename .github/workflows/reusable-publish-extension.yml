name: Publish browser extension

# Packages apps/extension (Piwi Picker) on each release tag with `npm run
# extension:zip` and keeps each file as a workflow artifact, to upload to a
# store by hand (apps/extension/PUBLISHING.md). A tag build then submits the
# package to each store whose secrets are configured, and skips the others:
#
# - Chrome Web Store: CHROME_PUBLISHER_ID, CHROME_CLIENT_ID,
#   CHROME_CLIENT_SECRET and CHROME_REFRESH_TOKEN.
# - Edge Add-ons: EDGE_PRODUCT_ID, EDGE_CLIENT_ID and EDGE_API_KEY. The API
#   updates an existing listing only: the first submission is made by hand.
# - Firefox Add-ons (AMO): AMO_JWT_ISSUER and AMO_JWT_SECRET.
# release.yml calls it: from a release tag it publishes; from anywhere else it
# only builds the artifacts.
on:
  workflow_call:
    secrets:
      CHROME_PUBLISHER_ID:
        required: false
      CHROME_CLIENT_ID:
        required: false
      CHROME_CLIENT_SECRET:
        required: false
      CHROME_REFRESH_TOKEN:
        required: false
      EDGE_PRODUCT_ID:
        required: false
      EDGE_CLIENT_ID:
        required: false
      EDGE_API_KEY:
        required: false
      AMO_JWT_ISSUER:
        required: false
      AMO_JWT_SECRET:
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: Browser extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: read
    env:
      TAG_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # Whether each store is configured. The secrets themselves reach only the
      # step that submits to that store.
      CHROME_CONFIGURED: ${{ secrets.CHROME_REFRESH_TOKEN != '' }}
      EDGE_CONFIGURED: ${{ secrets.EDGE_API_KEY != '' }}
      FIREFOX_CONFIGURED: ${{ secrets.AMO_JWT_SECRET != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      # The Chrome and Edge package, the Firefox package, the source package
      # AMO asks for, and the AMO listing (PUBLISHING.md §1).
      - name: Package
        id: package
        working-directory: ./apps/extension
        run: |
          npm run extension:zip
          echo "VERSION=$(node -p "require('./manifest.json').version")" >> "$GITHUB_ENV"

      # One artifact per file, uploaded as is: each downloads as the file its
      # store takes, not inside another zip.
      - name: Upload the Chrome and Edge package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: apps/extension/piwi-picker-v${{ env.VERSION }}.zip
          archive: false
          if-no-files-found: error

      - name: Upload the Firefox package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: apps/extension/piwi-picker-v${{ env.VERSION }}-firefox.zip
          archive: false
          if-no-files-found: error

      - name: Upload the source package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: apps/extension/piwi-picker-v${{ env.VERSION }}-source.zip
          archive: false
          if-no-files-found: error

      - name: Upload the AMO listing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: apps/extension/piwi-picker-v${{ env.VERSION }}-amo-metadata.json
          archive: false
          if-no-files-found: error

      # Each store's step runs whether or not the one before it failed, so one
      # store's failure fails the job without holding back the others.
      #
      # Chrome takes the package and submits it for review, and publishes it
      # once approved.
      - name: Publish to the Chrome Web Store
        if: ${{ !cancelled() && steps.package.outcome == 'success' && env.TAG_BUILD == 'true' && env.CHROME_CONFIGURED == 'true' }}
        working-directory: ./apps/extension
        env:
          EXTENSION_ID: pakhnokpjboejcghgcmkjlpnogfjihhe
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: npx --yes chrome-webstore-upload-cli@4.0.1 --source "piwi-picker-v$VERSION.zip"

      - name: Publish to Edge Add-ons
        if: ${{ !cancelled() && steps.package.outcome == 'success' && env.TAG_BUILD == 'true' && env.EDGE_CONFIGURED == 'true' }}
        uses: wdzeng/edge-addon@9881f57720358040d079eaa06a4596dc9c273eb6 # v2.1.1
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
          zip-path: apps/extension/piwi-picker-v${{ env.VERSION }}.zip

      # Submits dist-firefox/ (the files of the Firefox package) with the source
      # package, without waiting for the review. Until the add-on is public on
      # AMO, the whole listing goes with it; after that the listing is edited on
      # AMO, and only the version's own fields (license, compatibility, notes
      # to the reviewer) go.
      - name: Publish to Firefox Add-ons
        if: ${{ !cancelled() && steps.package.outcome == 'success' && env.TAG_BUILD == 'true' && env.FIREFOX_CONFIGURED == 'true' }}
        working-directory: ./apps/extension
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          metadata="piwi-picker-v$VERSION-amo-metadata.json"
          if curl -sf -o /dev/null "https://addons.mozilla.org/api/v5/addons/addon/picker@piwitests.dev/"; then
            jq '{version}' "$metadata" > "$RUNNER_TEMP/amo-version-metadata.json"
            metadata="$RUNNER_TEMP/amo-version-metadata.json"
          fi
          npx --yes web-ext@10.7.0 sign --channel listed --source-dir dist-firefox \
            --amo-metadata "$metadata" \
            --upload-source-code "piwi-picker-v$VERSION-source.zip" \
            --approval-timeout 0
