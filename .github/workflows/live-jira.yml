name: live-jira

# The live Jira E2E writes to a real Atlassian Cloud site, so it never runs on a
# push or pull request — only on demand. It files a French issue, reads it back,
# exercises a policy comment and one transition, and deletes every issue it made.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-jira
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./apps/application

jobs:
  live-jira:
    name: Live Jira E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIWI_JIRA_BASE_URL: ${{ secrets.PIWI_JIRA_BASE_URL }}
      PIWI_JIRA_EMAIL: ${{ secrets.PIWI_JIRA_EMAIL }}
      PIWI_JIRA_API_TOKEN: ${{ secrets.PIWI_JIRA_API_TOKEN }}
      PIWI_LIVE_JIRA_PROJECT_KEY: ${{ secrets.PIWI_LIVE_JIRA_PROJECT_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          playwright: shell

      - name: Build reporter
        working-directory: ./packages/reporter
        run: npm run reporter:build

      # Under CI the live config starts the production server from `.output`.
      - name: Build the app
        run: npm run app:build

      - name: Run the live Jira E2E
        run: npm run app:test:jira:live
