name: Deploy Docs & Demo

on:
  push:
    branches:
      - main
    paths:
      - 'apps/docs/**'
      - 'apps/application/**'
      - '.github/workflows/docs.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Build VitePress docs ──────────────────────────────────────────────
      - name: Set up the docs workspace
        uses: ./.github/actions/setup-workspace
        with:
          directory: apps/docs

      - name: Build docs with VitePress
        working-directory: ./apps/docs
        run: npm run docs:build

      # VitePress generates its own 404.html from the theme, overwriting the
      # file VitePress copied from apps/docs/public/.  Explicitly replace it so
      # GitHub Pages serves our lightweight SPA redirect script instead.
      - name: Override 404.html with SPA redirect
        run: cp apps/docs/public/404.html apps/docs/.vitepress/dist/404.html

      # ── Build Nuxt demo (SPA, deployed at /demo/) ─────────────────────────
      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Generate demo seed data
        working-directory: ./apps/application
        run: npm run app:seed:demo
        env:
          PIWI_DEMO_MODE: 'true'

      - name: Generate static demo site
        working-directory: ./apps/application
        run: npm run app:generate:demo
        env:
          PIWI_DEMO_MODE: 'true'

      # ── Combine into a single deploy directory ────────────────────────────
      - name: Copy demo into docs output at /demo/
        run: cp -r apps/application/.output/public apps/docs/.vitepress/dist/demo

      # ── Deploy to piwitests.github.io (org-level Pages) ───────────────────
      - name: Deploy to piwitests.github.io
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          external_repository: piwitests/piwitests.github.io
          publish_branch: main
          publish_dir: apps/docs/.vitepress/dist
          user_name: 'piwitests-bot'
          user_email: 'bot@piwitests.github.io'
