name: Desktop E2E

# Runs the Rust crate's unit tests, then smoke-tests the real desktop shell by
# driving its webview with Playwright via tauri-plugin-playwright (the app is
# built with the `e2e-testing` feature, which embeds the control plugin). The
# smoke test boots the whole app — server sidecar + native window — so this is
# heavier and slower than the unit/integration CI: ci.yml calls it on pull
# requests that change the desktop app, and it runs on demand.
on:
  workflow_call:
    inputs:
      build-artifact:
        description: >-
          Artifact of the calling run holding apps/application/.output, built on Linux:
          staging adds this OS's native modules. Empty builds the server here.
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

env:
  # Match the runtime the app bundles (apps/application/engines / reusable-publish-desktop.yml).
  PIWI_NODE_VERSION: 24.22.0

jobs:
  e2e:
    name: e2e
    # macOS runs the real Tauri webview headed (no xvfb), matching the plugin's
    # own e2e setup.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.PIWI_NODE_VERSION }}
          install: ${{ inputs.build-artifact == '' }}

      - name: Download the server bundle
        if: inputs.build-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.build-artifact }}

      - name: Build the server bundle
        if: inputs.build-artifact == ''
        # The Nuxt/Vite SSR build needs more heap than Node's default cap on the
        # macOS runner (it OOMs at ~2 GB otherwise; the ubuntu builds get a higher
        # default and don't need this).
        working-directory: apps/application
        run: npm run app:build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Stage the Node sidecar + bundled server
        working-directory: apps/desktop
        run: |
          node scripts/fetch-node.mjs --node "$PIWI_NODE_VERSION"
          npm run stage

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Generate app icons
        working-directory: apps/desktop
        run: npx tauri icon ../application/public/logo.svg

      - name: Install Playwright runtime
        working-directory: apps/desktop
        run: npx playwright install chromium

      # The shell's own unit tests (MCP client entries, the stdio bridge, the
      # local-run helpers). Runs ahead of the app build so a logic regression
      # fails here instead of minutes later in the webview. `build.rs` needs the
      # icons, the Node sidecar and the staged server, all present by this step.
      - name: Run Rust unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      # Compile up front so `tauri dev` (launched by the fixture) only has to boot,
      # keeping startup inside the fixture's startTimeout.
      - name: Pre-build the shell (e2e feature)
        working-directory: apps/desktop/src-tauri
        run: cargo build --features e2e-testing

      - name: Run e2e
        working-directory: apps/desktop
        run: npx playwright test --config e2e/playwright.config.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-report
          path: apps/desktop/playwright-report
          if-no-files-found: ignore
          retention-days: 7
