name: CI

# Every check of a pull request and of main, behind one required check: CI result. The `changes` job reads which
# areas the change touches, and each job runs for the areas it covers; a change to the workflows or to the Node
# version runs them all. A pull request runs the dashboard E2E suite on two backends and the package smoke test on
# Linux; main runs every backend and every system, and the JetBrains Plugin Verifier on every IDE. The extension,
# VS Code and desktop suites and the container image check run on pull requests only.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Every file release-please stamps carries the release version. The release PR moves version numbers and the
  # changelog only: this is the one job it runs, with npm ci, which fails when release-please left package.json and
  # package-lock.json out of step. The other jobs run on main once it merges.
  versions:
    name: Versions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          install: ${{ startsWith(github.head_ref, 'release-please--') }}
          ignore-scripts: 'true'

      - name: Check every stamped version
        run: node scripts/check-release-versions.mjs

  changes:
    name: Changes
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      # Lists the files of the pull request.
      pull-requests: read

    outputs:
      app: ${{ steps.filter.outputs.app == 'true' || steps.filter.outputs.ci == 'true' }}
      js: ${{ steps.filter.outputs.js == 'true' || steps.filter.outputs.ci == 'true' }}
      extension: ${{ steps.filter.outputs.extension == 'true' || steps.filter.outputs.ci == 'true' }}
      vscode: ${{ steps.filter.outputs.vscode == 'true' || steps.filter.outputs.ci == 'true' }}
      jetbrains: ${{ steps.filter.outputs.jetbrains == 'true' || steps.filter.outputs.ci == 'true' }}
      desktop: ${{ steps.filter.outputs.desktop == 'true' || steps.filter.outputs.ci == 'true' }}
      docs: ${{ steps.filter.outputs.docs == 'true' || steps.filter.outputs.ci == 'true' }}
      dotnet: ${{ steps.filter.outputs.dotnet == 'true' || steps.filter.outputs.ci == 'true' }}
      nitro: ${{ steps.filter.outputs.nitro == 'true' || steps.filter.outputs.ci == 'true' }}
      container: ${{ steps.filter.outputs.app == 'true' || steps.filter.outputs.container == 'true' || steps.filter.outputs.ci == 'true' }}
      e2e_matrix: ${{ steps.matrices.outputs.e2e }}
      smoke_matrix: ${{ steps.matrices.outputs.smoke }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `app` is what the dashboard's build, E2E, package smoke and demo jobs depend on: the server bundles the docs
      # pages and the changelog for its MCP tools. `js` is every workspace the checks job formats, lints and tests,
      # and what knip reads besides them (its config, the configs of the tools it knows, the git hooks).
      - name: Read the areas the change touches
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.node-version'
            app:
              - 'apps/application/**'
              - 'apps/docs/**'
              - 'packages/core/**'
              - 'packages/picker-dom/**'
              - 'packages/reporter/**'
              - 'packages/server/**'
              - 'integrations/nitro/**'
              - 'scripts/package-smoke.mjs'
              - 'CHANGELOG.md'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
            js:
              - 'apps/application/**'
              - 'apps/docs/**'
              - 'apps/extension/**'
              - 'apps/vscode/**'
              - 'packages/**'
              - 'integrations/nitro/**'
              - 'shared/**'
              - 'scripts/**'
              - 'CHANGELOG.md'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'knip.ts'
              - 'commitlint.config.js'
              - '.husky/**'
              - '.editorconfig'
            extension:
              - 'apps/extension/**'
              - 'packages/core/**'
              - 'packages/picker-dom/**'
            # Both editor clients ship the recorder's IDE bundle, which the editor service builds from the extension.
            vscode:
              - 'apps/vscode/**'
              - 'packages/editor/**'
              - 'packages/core/**'
              - 'packages/picker-dom/**'
              - 'apps/extension/src/**'
              - 'apps/extension/public/_locales/**'
              - 'apps/extension/scripts/build.mjs'
            jetbrains:
              - 'apps/jetbrains/**'
              - 'packages/editor/**'
              - 'packages/core/**'
              - 'packages/picker-dom/**'
              - 'apps/extension/src/**'
              - 'apps/extension/public/_locales/**'
              - 'apps/extension/scripts/build.mjs'
            # The desktop app bundles the Node version of the Dockerfile's base image.
            desktop:
              - 'apps/desktop/**'
              - 'Dockerfile'
            # The site, and what apps/docs/scripts generate pages from.
            docs:
              - 'apps/docs/**'
              - 'apps/application/shared/**'
              - 'apps/application/package.json'
              - 'packages/reporter/src/public/options.ts'
              - 'packages/reporter/src/internal/config/env.ts'
              - 'CHANGELOG.md'
            # With `app`: what the server image is built from.
            container:
              - 'Dockerfile'
              - '.dockerignore'
            dotnet:
              - 'integrations/aspnetcore/**'
              - 'integrations/serilog/**'
              - 'examples/sample-app/backends/aspnetcore/**'
              - 'examples/sample-app/backends/aspnetcore.Tests/**'
            # The Nitro plugin, the sample backend that loads it from source, and the root manifests that pin its
            # TypeScript, Vitest and peer dependencies.
            nitro:
              - 'integrations/nitro/**'
              - 'examples/sample-app/backends/nitro/**'
              - 'package.json'
              - 'package-lock.json'
            smoke:
              - 'packages/server/**'
              - 'packages/reporter/**'
              - 'scripts/package-smoke.mjs'
              - 'apps/application/package.json'
              - 'apps/application/nuxt.config.ts'
              - 'package-lock.json'

      # Storage and database are independent axes: a pull request runs each implementation once (local + sqlite, on
      # the dashboard's Node 22 engines floor, and s3 + postgres), main runs every pair. Windows and macOS catch what
      # breaks only on their paths or native binaries: a pull request runs them when it changes the packages or their
      # dependencies, main always.
      - name: Pick the E2E backends and the package smoke systems
        id: matrices
        env:
          ON_MAIN: ${{ github.event_name == 'push' }}
          PACKAGES_CHANGED: ${{ steps.filter.outputs.smoke == 'true' || steps.filter.outputs.ci == 'true' }}
        run: |
          backends='[{"storage":"local","database":"sqlite","node":"22"},{"storage":"s3","database":"postgres","node":""}]'
          crossed='[{"storage":"local","database":"postgres","node":""},{"storage":"s3","database":"sqlite","node":""}]'
          if [ "$ON_MAIN" = true ]; then backends=$(jq -c --argjson more "$crossed" '. + $more' <<< "$backends"); fi
          echo "e2e=$(jq -c '[.[] as $b | range(1; 6) | $b + {shard: .}]' <<< "$backends")" >> "$GITHUB_OUTPUT"

          systems='[{"os":"ubuntu-latest","node":"22"}]'
          if [ "$ON_MAIN" = true ] || [ "$PACKAGES_CHANGED" = true ]; then
            systems='[{"os":"ubuntu-latest","node":"22"},{"os":"windows-latest","node":"24"},{"os":"macos-latest","node":"24"}]'
          fi
          echo "smoke=$systems" >> "$GITHUB_OUTPUT"

  # Builds once for every E2E cell: the storage and database backends are read
  # from the environment at request time, so a single production output covers
  # the whole matrix. The desktop suite stages the same output on macOS.
  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.app == 'true' || (needs.changes.outputs.desktop == 'true' && github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      # Restored after the install so the postinstall `nuxt prepare` cannot
      # clobber it. It holds the tool caches (jiti, Vite, fonts), never a Nuxt
      # build: `experimental.buildCache` is off on CI (nuxt.config.ts), so every
      # build compiles the client from the commit's own sources.
      - name: Cache build tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache
            apps/application/node_modules/.cache
          # `nuxt-build-v3-` carries a manual cache version — bump the token to
          # discard the cached content.
          key: nuxt-build-v3-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nuxt-build-v3-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nuxt-build-v3-${{ runner.os }}-

      # The reporter dist is imported by playwright.config.ts.
      - name: Build reporter
        working-directory: packages/reporter
        run: npm run reporter:build

      - name: Build application
        working-directory: apps/application
        run: npm run app:build

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output
          path: |
            apps/application/.output
            packages/reporter/dist
          # `.output` is dot-prefixed, so without this the upload silently skips it.
          include-hidden-files: true
          retention-days: 1
          compression-level: 1

      # Packed from this build the way reusable-publish-npm.yml packs a release, so
      # the package smoke job installs what a user downloads from npm.
      - name: Pack npm packages
        run: |
          mkdir -p npm-packages
          npm pack --workspace @piwitests/server --workspace @piwitests/reporter --pack-destination npm-packages

      - name: Upload npm packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: npm-packages/*.tgz
          retention-days: 1
          # The tarballs are already gzipped.
          compression-level: 0

      # The performance job of a pull request measures against its base commit's build, restored by this key and path
      # (perf-base, reusable-perf.yml). A cache saved on main serves every pull request; one a pull request saves
      # serves it alone.
      - name: Stage the build as a performance base
        if: github.event_name == 'push'
        run: |
          mkdir -p base/apps/application
          cp -a apps/application/.output base/apps/application/.output

      - name: Save the build as a performance base
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: base/apps/application/.output
          key: perf-base-output-v1-${{ github.sha }}

  # Backend-agnostic checks. Independent of the E2E matrix, so they run alongside it.
  checks:
    name: Lint, typecheck and unit tests
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      # Lets the coverage-report steps below post/update a sticky PR comment.
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          playwright: shell

      # Every workspace's files as the pre-commit hook formats them.
      - name: Check formatting
        run: |
          npm run app:format:check -w apps/application
          npm run extension:format:check -w apps/extension
          npm run vscode:format:check -w apps/vscode
          npm run core:format:check -w packages/core
          npm run picker-dom:format:check -w packages/picker-dom
          npm run editor:format:check -w packages/editor
          npm run reporter:format:check -w packages/reporter

      - name: Lint
        working-directory: apps/application
        run: npm run app:lint

      - name: Typecheck
        working-directory: apps/application
        run: npm run app:typecheck

      - name: Lint reporter
        working-directory: packages/reporter
        run: npm run reporter:lint

      - name: Typecheck reporter
        working-directory: packages/reporter
        run: npm run reporter:typecheck

      - name: Lint, typecheck and test core
        working-directory: packages/core
        run: |
          npm run core:lint
          npm run core:typecheck
          npm run core:test

      - name: Lint, typecheck and test picker-dom
        working-directory: packages/picker-dom
        run: |
          npm run picker-dom:lint
          npm run picker-dom:typecheck
          npm run picker-dom:test

      - name: Lint, typecheck, build and test the editor service
        working-directory: packages/editor
        run: |
          npm run editor:lint
          npm run editor:typecheck
          npm run editor:build
          npm run editor:test

      - name: Lint, typecheck, build and unit-test the VS Code extension
        working-directory: apps/vscode
        run: |
          npm run vscode:lint
          npm run vscode:typecheck
          npm run vscode:build
          npm run vscode:test

      - name: Lint, typecheck and unit-test extension
        working-directory: apps/extension
        run: |
          npm run extension:lint
          npm run extension:typecheck
          npm run extension:test

      - name: Test picker-dom integration (drives a real browser)
        working-directory: packages/picker-dom
        run: npm run picker-dom:test:integration

      # The reporter's flake-run and build-output specs load the built package, and so does knip, through the
      # dashboard's Playwright config.
      - name: Build reporter
        working-directory: packages/reporter
        run: npm run reporter:build

      # Unused files, exports and dependencies, and imports of packages a workspace does not declare.
      - name: Knip
        run: npm run knip

      # The breakpoint run (tests/pause-run.spec.ts) opens Chromium's windows, under a display: the full build, beside
      # the headless shell the setup action already saved to its cache.
      - name: Install the full Chromium build
        run: npx playwright install chromium --no-shell

      - name: Test reporter
        working-directory: packages/reporter
        run: xvfb-run -a npm run reporter:test:coverage

      # Full AI-step pipeline (resolve → compile → replay) end to end against a
      # real browser, with a stub standing in for the LLM: no network, no tokens.
      - name: Test reporter AI steps (integration, drives a real browser)
        working-directory: packages/reporter
        run: npm run reporter:test:integration:ai

      - name: Report reporter coverage on the PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          working-directory: ./packages/reporter
          name: Reporter
          file-coverage-mode: changes

      - name: Test application unit tests
        working-directory: apps/application
        run: npm run app:test:unit:coverage

      - name: Report application coverage on the PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          working-directory: ./apps/application
          name: Application
          file-coverage-mode: changes

  e2e:
    name: E2E (storage=${{ matrix.storage }}, db=${{ matrix.database }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 15

    strategy:
      # Run every cell to completion so one backend failing doesn't mask the others.
      fail-fast: false
      # The backends `changes` picks, five shards each: 10 jobs on a pull request, 20 on main, where they fill the
      # 20 concurrent job slots. The local + sqlite leg runs on Node 22, the dashboard's engines floor, against the
      # Node 24-built output, the same combination an npm user on LTS gets; the others run the root .node-version.
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.e2e_matrix) }}

    env:
      # Keep in step with the shards `changes` lists.
      SHARD_TOTAL: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The containers boot while node and the dependencies install; the readiness
      # probes below collect them once that work is done.
      # MinIO stopped publishing free Docker images (repo archived in 2026), so
      # the S3-compatible test backend is RustFS (Apache-2.0, S3 API on :9000).
      # The console is off — the tests only touch the S3 API.
      - name: Start RustFS (local S3 server)
        if: matrix.storage == 's3'
        run: |
          docker run -d \
            --name rustfs \
            -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=PIWICIACCESSKEY \
            -e RUSTFS_SECRET_KEY=PIWICISECRETKEY \
            -e RUSTFS_ADDRESS=:9000 \
            -e RUSTFS_CONSOLE_ENABLE=false \
            rustfs/rustfs:1.0.0-rc.6 /data

      - name: Start PostgreSQL
        if: matrix.database == 'postgres'
        run: |
          docker run -d \
            --name postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=playwright_test \
            postgres:16-alpine

      # Only the chromium project is enabled in playwright.config.ts.
      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node || '' }}
          playwright: shell

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output

      - name: Create S3 buckets
        if: matrix.storage == 's3'
        env:
          AWS_ACCESS_KEY_ID: PIWICIACCESSKEY
          AWS_SECRET_ACCESS_KEY: PIWICISECRETKEY
        run: |
          # Wait up to 60 s for the S3 API to answer with our credentials. This
          # is server-agnostic (a successful ListBuckets), so it also confirms
          # auth works, not just that an HTTP port is open.
          timeout 60 bash -c 'until aws --endpoint-url http://localhost:9000 s3 ls >/dev/null 2>&1; do sleep 2; done'
          # Bucket for the main app server under test, plus the bucket the
          # dedicated s3-storage.spec.ts adapter tests target.
          aws --endpoint-url http://localhost:9000 s3 mb s3://piwi-main --region us-east-1
          aws --endpoint-url http://localhost:9000 s3 mb s3://playwright-test --region us-east-1

      - name: Create PostgreSQL databases
        if: matrix.database == 'postgres'
        run: |
          # Wait for the real server over TCP. During initdb the alpine image runs
          # a temporary server that listens only on the unix socket, so unix-socket
          # probes (pg_isready / psql) pass against it and then get killed on
          # restart. Forcing TCP (-h 127.0.0.1) only succeeds once the real server
          # is up and stable.
          timeout 60 bash -c 'until docker exec -e PGPASSWORD=postgres postgres psql -h 127.0.0.1 -U postgres -c "SELECT 1" >/dev/null 2>&1; do sleep 1; done'
          # Separate database for the main app server so it never races the
          # dedicated postgresql.spec.ts server (which owns playwright_test).
          docker exec -e PGPASSWORD=postgres postgres psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE playwright_main;'

      # The unit tests that need a PostgreSQL server (`*-pg.test.ts`), once per run: in the first shard of the s3 +
      # postgres cell, the one a pull request and main both run. Each test creates and drops a database of its own.
      - name: Run the PostgreSQL unit tests
        if: matrix.database == 'postgres' && matrix.storage == 's3' && matrix.shard == 1
        working-directory: apps/application
        env:
          PIWI_POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/playwright_test
        run: npm run app:test:unit -- tests/unit/*-pg.test.ts

      - name: Run Playwright Tests
        working-directory: apps/application
        env:
          # The suite runs against the production build, where the cleanup
          # endpoint its global setup/teardown calls is disabled by default.
          PIWI_TEST_CLEANUP_ENABLED: 'true'
          # --- Main app server backend (driven by the matrix) ---
          PIWI_STORAGE_TYPE: ${{ matrix.storage }}
          PIWI_S3_ENDPOINT: ${{ matrix.storage == 's3' && 'http://localhost:9000' || '' }}
          PIWI_S3_BUCKET: ${{ matrix.storage == 's3' && 'piwi-main' || '' }}
          PIWI_S3_REGION: ${{ matrix.storage == 's3' && 'us-east-1' || '' }}
          PIWI_S3_ACCESS_KEY_ID: ${{ matrix.storage == 's3' && 'PIWICIACCESSKEY' || '' }}
          PIWI_S3_SECRET_ACCESS_KEY: ${{ matrix.storage == 's3' && 'PIWICISECRETKEY' || '' }}
          PIWI_S3_FORCE_PATH_STYLE: ${{ matrix.storage == 's3' && 'true' || '' }}
          PIWI_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:postgres@localhost:5432/playwright_main' || '' }}
          # --- Dedicated adapter specs (s3-storage.spec.ts / postgresql.spec.ts) ---
          # These self-skip and self-provision their own server when their var is empty.
          PIWI_S3_TEST_ENDPOINT: ${{ matrix.storage == 's3' && 'http://localhost:9000' || '' }}
          PIWI_S3_TEST_BUCKET: ${{ matrix.storage == 's3' && 'playwright-test' || '' }}
          PIWI_S3_TEST_REGION: ${{ matrix.storage == 's3' && 'us-east-1' || '' }}
          PIWI_S3_TEST_ACCESS_KEY_ID: ${{ matrix.storage == 's3' && 'PIWICIACCESSKEY' || '' }}
          PIWI_S3_TEST_SECRET_ACCESS_KEY: ${{ matrix.storage == 's3' && 'PIWICISECRETKEY' || '' }}
          PIWI_POSTGRES_TEST_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:postgres@localhost:5432/playwright_test' || '' }}
        # The servers pointed at .test-temp only create their database file, not
        # the directory holding it, and Playwright starts them before globalSetup.
        run: |
          mkdir -p .test-temp
          npm run app:test -- --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }}

      - name: Upload blob report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.storage }}-${{ matrix.database }}-${{ matrix.shard }}
          path: apps/application/blob-report
          retention-days: 3

  # The execution and failure-cluster pages against their legibility budgets (apps/application/AGENTS.md, "Measure
  # it."), on this build and a database seeded from the demo seed.
  measure:
    name: Failure page budgets
    needs: [changes, build]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          playwright: shell

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output

      - name: Measure the failure pages against their budgets
        working-directory: apps/application
        run: npm run app:measure -- --build .output --check

  # Installs the packed @piwitests/server and @piwitests/reporter into a new project,
  # starts the server with `npx @piwitests/server` and runs a suite through the reporter
  # (scripts/package-smoke.mjs). Windows and macOS catch what breaks only on their paths
  # or native binaries; the Linux leg runs the server package's Node 22 floor.
  package-smoke:
    name: Package smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    needs: [changes, build]
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 10

    strategy:
      fail-fast: false
      # The systems `changes` picks.
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.smoke_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node }}
          install: 'false'

      - name: Download npm packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm-packages

      - name: Install the packages and report a run through them
        run: node scripts/package-smoke.mjs npm-packages

  demo:
    name: Test demo generation
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          playwright: shell

      # seed.sql is gitignored, so the build has no database to load until it is
      # generated here — exactly as the docs deploy does before building.
      - name: Generate demo seed data
        working-directory: apps/application
        run: npm run app:seed:demo

      - name: Run demo-generate
        working-directory: apps/application
        run: npm run app:generate:demo

      # Building the demo only proves it compiles. This drives the built SPA
      # from its real sub-path with the service worker installed, which is the
      # only way base-path, worker-scope and demo-handler breakage shows up.
      - name: Check the built demo actually runs
        working-directory: apps/application
        run: npm run app:check:demo:runtime

  aspnet:
    name: Build ASP.NET instrumentation
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'

      # Builds every package for every target framework and runs the tests. The
      # NuGet packages are packed and published from a release tag by
      # reusable-publish-nuget.yml.
      - name: Build and test
        working-directory: integrations/aspnetcore
        run: dotnet test PiwiTests.Instrumentation.slnx -c Release

  # The Nitro plugin's type check and unit tests: the checks job reads this workspace through knip alone, and
  # reusable-publish-npm.yml only builds it. No install scripts: the plugin needs no `nuxt prepare`.
  nitro:
    name: Typecheck and test the Nitro instrumentation
    needs: changes
    if: needs.changes.outputs.nitro == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          ignore-scripts: 'true'

      - name: Typecheck
        working-directory: integrations/nitro
        run: npm run typecheck

      - name: Test
        working-directory: integrations/nitro
        run: npm test

  # The server image as the release publishes it, for linux/amd64: built, started on an empty data folder and asked
  # for /api/health. On main and on a release tag, the publish workflow runs the same check before any tag moves.
  container:
    name: Container image
    needs: changes
    if: needs.changes.outputs.container == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Reads the layer cache main's image builds write, and writes none.
      - name: Build the image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: piwi-server:ci
          build-args: |
            PIWI_BUILD_SHA=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/piwitests/platform:buildcache-linux-amd64

      - name: Check the image answers
        uses: ./.github/actions/container-health
        with:
          image: piwi-server:ci

  # docs.yml builds and deploys the site from main; a pull request that changes it builds it here first.
  docs:
    name: Docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the docs workspace
        uses: ./.github/actions/setup-workspace
        with:
          directory: apps/docs

      - name: Build docs with VitePress
        working-directory: apps/docs
        run: npm run docs:build

  extension:
    name: Extension E2E
    needs: changes
    if: needs.changes.outputs.extension == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-e2e-extension.yml

  vscode:
    name: VS Code E2E
    needs: changes
    if: needs.changes.outputs.vscode == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-e2e-vscode.yml

  # On main the plugin job also writes the Gradle cache the pull requests read.
  jetbrains:
    name: JetBrains plugin
    needs: changes
    if: needs.changes.outputs.jetbrains == 'true'
    uses: ./.github/workflows/reusable-jetbrains.yml
    with:
      all-ides: ${{ github.event_name == 'push' }}

  desktop:
    name: Desktop E2E
    needs: [changes, build]
    if: needs.changes.outputs.desktop == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-e2e-desktop.yml
    with:
      build-artifact: build-output

  # The base commit's build the performance job measures against. The build job cached it by its sha when that commit
  # ran on main; when it did not (main's change left the build alone, or a later push cancelled its run), it is built
  # here, alongside this pull request's own build, and cached for this pull request's runs only.
  perf-base:
    name: Performance base
    needs: changes
    if: needs.changes.outputs.app == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The merge commit and its first parent: the base the pull request is measured against.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Read the base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

      - name: Look for the base build
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: base/apps/application/.output
          key: perf-base-output-v1-${{ steps.base.outputs.sha }}
          lookup-only: true

      - name: Check out the base
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base

      - name: Install the base
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-workspace
        with:
          directory: base

      - name: Build the base
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: base/apps/application
        run: npm run app:build

      - name: Save the base build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: base/apps/application/.output
          key: perf-base-output-v1-${{ steps.base.outputs.sha }}

  # The heaviest pages measured on this build and on the base commit's, posted as a comment on the pull request.
  perf:
    name: Performance
    needs: [changes, build, perf-base]
    if: needs.changes.outputs.app == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-perf.yml
    permissions:
      contents: read
      pull-requests: write

  # The one check branch protection requires: it fails when any job above failed or was cancelled, and passes when
  # each one passed or was skipped because the change does not touch its area.
  ci-result:
    name: CI result
    if: ${{ !cancelled() }}
    needs: [versions, changes, build, checks, e2e, measure, package-smoke, demo, aspnet, nitro, container, docs, extension, vscode, jetbrains, desktop, perf-base, perf]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          exit 1
