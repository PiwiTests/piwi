name: Performance

# Measures the dashboard's heaviest pages (the projects list, every tab of a project, the test-run page, a failed
# execution's page with a large trace) on the pull request's build and on its base commit's, against the same dataset
# in PostgreSQL, and writes the comparison: render and load times, the SQL each request runs, and every regression past
# its threshold. The suite is apps/application/scripts/perf.
# The pages are split across the `measure` jobs, which run at once: each measures both builds in turn on its own pages
# (`run.mjs --shard`), so every comparison is made on one machine, and the `report` job joins their results into the job
# summary and the `perf-results` artifact, which perf-comment.yml posts on the pull request. The base commit's build is
# the one ci.yml's `perf-base` job cached.
# A regression is reported, not enforced: the jobs fail only when the suite itself cannot run.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  measure:
    name: Measure (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # One machine per entry, each measuring a contiguous share of the pages. Two keep each job near five minutes,
        # where one machine took ten to sixteen; every entry adds its own setup and seed, about two minutes.
        shard: [1, 2]

    steps:
      # The merge commit and its first parent: the base the pull request is measured against.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # pg_stat_statements counts every statement of either build, including a base that predates the suite's tracing.
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_PASSWORD=postgres postgres:16-alpine \
            -c shared_preload_libraries=pg_stat_statements \
            -c pg_stat_statements.track_utility=off \
            -c pg_stat_statements.max=20000 \
            -c shared_buffers=512MB

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          playwright: shell

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output

      - name: Read the base and head commits
        id: base
        run: |
          echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD^1)" >> "$GITHUB_OUTPUT"
          echo "head_short=$(git rev-parse --short HEAD^2)" >> "$GITHUB_OUTPUT"

      # Saved by ci.yml: by the build job when the base commit ran on main, else by the perf-base job of this run.
      - name: Restore the base build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: base/apps/application/.output
          key: perf-base-output-v1-${{ steps.base.outputs.sha }}
          fail-on-cache-miss: true

      - name: Wait for PostgreSQL
        run: timeout 60 bash -c 'until docker exec postgres psql -h 127.0.0.1 -U postgres -c "SELECT 1" >/dev/null 2>&1; do sleep 1; done'

      - name: Measure the base and the pull request
        working-directory: apps/application
        env:
          BASE_LABEL: ${{ github.base_ref }} ${{ steps.base.outputs.short }}
          HEAD_LABEL: '#${{ github.event.pull_request.number }} ${{ steps.base.outputs.head_short }}'
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          OUT: ../../perf/results-${{ matrix.shard }}.json
        run: |
          node scripts/perf/run.mjs \
            --target base=../../base/apps/application/.output \
            --target head=.output \
            --label "base=${BASE_LABEL}" \
            --label "head=${HEAD_LABEL}" \
            --database postgres \
            --pg-url postgresql://postgres:postgres@127.0.0.1:5432/postgres \
            --shard "${SHARD}" \
            --out "${OUT}"

      - name: Upload the results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-shard-${{ matrix.shard }}
          path: perf
          retention-days: 1

  report:
    name: Report
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The report reads Node's own modules only: no install.
      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          install: 'false'

      - name: Download the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-shard-*
          merge-multiple: true
          path: perf

      # Fails when a shard's results are missing, rather than reporting on part of the pages. `pull-request` names the
      # pull request the report is for, which perf-comment.yml needs when two open pull requests share a head commit.
      - name: Join the results and write the report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          shards=()
          for file in perf/results-*.json; do shards+=(--results "$file"); done
          node apps/application/scripts/perf/report.mjs "${shards[@]}" \
            --merged perf/results.json --out perf/report.md --run-url "${RUN_URL}"
          echo "${PULL_NUMBER}" > perf/pull-request

      - name: Upload the results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: perf
          retention-days: 14

      - name: Write the job summary
        run: cat perf/report.md >> "$GITHUB_STEP_SUMMARY"
