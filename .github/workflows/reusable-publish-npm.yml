name: Publish npm packages

# @piwitests/reporter, @piwitests/server and @piwitests/instrumentation-nitro, one job each, so one failing holds back
# none of the others. release.yml calls it. On a release tag it publishes with provenance; anywhere else it builds the
# packages and runs `npm pack --dry-run`, without the token: npm publish checks the version against the registry once
# it is logged in, and the version on a branch is the one already published.
on:
  workflow_call:
    inputs:
      server-artifact:
        description: Artifact of the calling run holding apps/application/.output, built with the node-server preset.
        type: string
        required: true
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: read

env:
  TAG_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  reporter:
    name: '@piwitests/reporter'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: read
      # npm publish --provenance
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          registry-url: https://registry.npmjs.org

      - name: Build reporter
        working-directory: packages/reporter
        run: npm run reporter:build

      - name: Publish to npm
        if: env.TAG_BUILD == 'true'
        working-directory: packages/reporter
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Pack
        if: env.TAG_BUILD != 'true'
        working-directory: packages/reporter
        run: npm pack --dry-run

      - name: Summary
        if: env.TAG_BUILD == 'true'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## NPM Package Published :package:

          - **Package**: \`@piwitests/reporter\`
          - **Version**: \`${GITHUB_REF_NAME#v}\`

          ### Install
          \`\`\`bash
          npm install @piwitests/reporter
          \`\`\`
          EOF

  # The dashboard server as an npm package (npx @piwitests/server). The package's `prepack` step
  # (scripts/copy-output.mjs) copies in the node-server output the calling run built.
  server:
    name: '@piwitests/server'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: read
      # npm publish --provenance
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          ignore-scripts: 'true'
          registry-url: https://registry.npmjs.org

      - name: Download the server bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.server-artifact }}
          path: apps/application/.output

      - name: Publish to npm
        if: env.TAG_BUILD == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace @piwitests/server --access public --provenance

      - name: Pack
        if: env.TAG_BUILD != 'true'
        run: npm pack --workspace @piwitests/server --dry-run

      - name: Summary
        if: env.TAG_BUILD == 'true'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## NPM Package Published :package:

          - **Package**: \`@piwitests/server\`
          - **Version**: \`${GITHUB_REF_NAME#v}\`

          ### Run
          \`\`\`bash
          npx @piwitests/server
          \`\`\`
          EOF

  instrumentation:
    name: '@piwitests/instrumentation-nitro'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: read
      # npm publish --provenance
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          registry-url: https://registry.npmjs.org

      - name: Build the instrumentation
        working-directory: integrations/nitro
        run: npm run build

      - name: Publish to npm
        if: env.TAG_BUILD == 'true'
        working-directory: integrations/nitro
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Pack
        if: env.TAG_BUILD != 'true'
        working-directory: integrations/nitro
        run: npm pack --dry-run
