name: Publish JetBrains plugin

# Builds apps/jetbrains on each release tag, signs it on a release tag when the
# signing secrets are configured (JETBRAINS_CERTIFICATE_CHAIN, JETBRAINS_PRIVATE_KEY
# and JETBRAINS_PRIVATE_KEY_PASSWORD), and keeps the plugin archive as a workflow
# artifact, to publish or install by hand. A tag build then publishes it to the
# JetBrains Marketplace (JETBRAINS_PUBLISH_TOKEN); skipped without the token.
# release.yml calls it: from a release tag it publishes; from anywhere else it
# only builds the artifact.
on:
  workflow_call:
    secrets:
      JETBRAINS_CERTIFICATE_CHAIN:
        required: false
      JETBRAINS_PRIVATE_KEY:
        required: false
      JETBRAINS_PRIVATE_KEY_PASSWORD:
        required: false
      JETBRAINS_PUBLISH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: JetBrains plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: read
    env:
      TAG_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # Whether signing and publishing are configured. The secrets themselves
      # reach only the steps that sign and publish.
      SIGNING_CONFIGURED: ${{ secrets.JETBRAINS_PRIVATE_KEY != '' }}
      PUBLISH_CONFIGURED: ${{ secrets.JETBRAINS_PUBLISH_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      # The plugin's change notes, the Marketplace's "What's new": the release's
      # `ide` entries of the root CHANGELOG.md as HTML, which build.gradle.kts
      # reads from CHANGE_NOTES into plugin.xml. Set before the first Gradle run,
      # so every run of the job builds the same plugin.xml.
      - name: Write the change notes
        run: |
          node scripts/ide-changelog.mjs --format html > "$RUNNER_TEMP/change-notes.html"
          {
            echo 'CHANGE_NOTES<<CHANGE_NOTES_END'
            cat "$RUNNER_TEMP/change-notes.html"
            echo 'CHANGE_NOTES_END'
          } >> "$GITHUB_ENV"

      - name: Build the editor service
        working-directory: ./packages/editor
        run: npm run editor:build

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build
        id: build
        working-directory: ./apps/jetbrains
        run: ./gradlew buildPlugin

      # Writes piwi-jetbrains-<version>-signed.zip next to the built archive.
      # Only a release tag's build is signed: signing runs the build script
      # with the private key in its environment.
      - name: Sign
        if: ${{ env.TAG_BUILD == 'true' && env.SIGNING_CONFIGURED == 'true' }}
        working-directory: ./apps/jetbrains
        env:
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin

      # The signed archive when signing succeeded, the built one otherwise: a
      # failed signing fails the job and skips publishing, but keeps the
      # artifact.
      - name: Pick the plugin archive
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ./apps/jetbrains
        run: |
          archive="build/distributions/piwi-jetbrains-$(sed -n 's/^pluginVersion=//p' gradle.properties)"
          if [ -f "$archive-signed.zip" ]; then archive="$archive-signed"; fi
          echo "PLUGIN_ARCHIVE=apps/jetbrains/$archive.zip" >> "$GITHUB_ENV"

      # Uploaded as is: it downloads as the plugin archive, not inside another
      # zip.
      - name: Upload the plugin
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.PLUGIN_ARCHIVE }}
          archive: false
          if-no-files-found: error

      # publishPlugin uploads the signed archive when the signing secrets are
      # set, and the built one otherwise.
      - name: Publish to the JetBrains Marketplace
        if: ${{ env.TAG_BUILD == 'true' && env.PUBLISH_CONFIGURED == 'true' }}
        working-directory: ./apps/jetbrains
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin
