name: Playwright next

# The reporter's suite and its two integration suites on Playwright's next release (`@playwright/test@next`, the daily
# alpha), every week and on demand. It is no pull request check: Playwright's private APIs the reporter reads (the
# server-side instrumentation, `_timeoutManager`, `_stepMap`, the API call decorators) move in Playwright's own
# repository, and a failure here shows the change before a release carries it. Every suite runs, whichever failed
# before it.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reporter:
    name: Reporter tests (Playwright next)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      # The flake-run and build-output specs load the built package.
      - name: Build reporter
        working-directory: packages/reporter
        run: npm run reporter:build

      - name: Install Playwright's next release
        run: node scripts/playwright-floor.mjs --install next

      - name: Install its Chromium
        run: npx playwright install chromium --with-deps

      - name: Test
        working-directory: packages/reporter
        run: xvfb-run -a npm run reporter:test

      - name: Test the AI steps (integration, drives a real browser)
        if: ${{ !cancelled() }}
        working-directory: packages/reporter
        run: npm run reporter:test:integration:ai

      - name: Test the capture fixtures (integration, drives a real browser)
        if: ${{ !cancelled() }}
        working-directory: packages/reporter
        run: npm run reporter:test:integration
