name: Edge image

# The container image of main, pushed to GHCR as `edge` for every commit that lands there. A newer commit's run
# replaces one still building.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  container:
    name: Container image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-publish-container.yml
