name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A tag/commit/PR made with the default GITHUB_TOKEN does not trigger
          # other workflows (GitHub's anti-recursion protection) — the release
          # tag this step creates would silently never fire release.yml. A PAT
          # or GitHub App token isn't subject to that restriction. See
          # CONTRIBUTING.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
