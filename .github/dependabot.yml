version: 2
updates:
  # The root lockfile covers the npm workspaces (apps/*, packages/*, integrations/nitro); the desktop shell and the
  # docs site install from lockfiles of their own.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/apps/desktop"
      - "/apps/docs"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7, the native compiler, has no compiler API: vue-tsc, tsup's declaration build and the tests that
      # parse source with `typescript` need one.
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
      # The VS Code API the extension types against is the oldest it supports, apps/vscode's engines.vscode: the two
      # move together, by hand.
      - dependency-name: "@types/vscode"
      # vue-tsc 3.3.12 and 3.3.13 lose a v-for's variables and a v-if's narrowing inside a component's slot, and fail
      # the dashboard's typecheck on code 3.3.11 accepts.
      - dependency-name: "vue-tsc"
        versions: ["3.3.12", "3.3.13"]
      # @libsql/client 0.18 runs a local database on a pool of connections and rolls back a connection's open
      # transaction when it goes back to the pool: the per-connection pragmas (sqlite-connections.ts) and the
      # migration repair's transaction (migration-targets.ts) are written for 0.17's single connection.
      - dependency-name: "@libsql/client"
        versions: [">= 0.18.0"]
    groups:
      # @vueuse/nuxt pins the @vueuse/core it auto-imports: the two move together, majors included.
      vueuse:
        patterns:
          - "@vueuse/*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The desktop shell's Rust crates
  - package-ecosystem: cargo
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The JetBrains plugin's Gradle plugins and libraries, and the Gradle wrapper
  - package-ecosystem: gradle
    directory: "/apps/jetbrains"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    ignore:
      # Kotlin 2.4 no longer compiles language version 1.9, which the oldest supported platform (2024.1) bundles:
      # it moves with pluginSinceBuild.
      - dependency-name: "org.jetbrains.kotlin.jvm"
        versions: [">= 2.4.0"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The .NET instrumentation packages, their tests and the sample app's backend. A library's dependency versions are
  # the oldest its users may run, so they move within their major only; release-please stamps PiwiTests.* itself.
  - package-ecosystem: nuget
    directories:
      - "/integrations/aspnetcore/*"
      - "/integrations/serilog/*"
      - "/examples/sample-app/backends/*"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "PiwiTests.*"
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The workflows, and the composite actions under .github/actions
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # The server image's base, pinned by tag and digest in the Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    ignore:
      # Node 24 is the major the desktop app bundles and the root package.json's engines name: the image stays on it.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
