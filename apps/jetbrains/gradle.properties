# The plugin's version follows the monorepo release (release-please updates it).
# x-release-please-start-version
pluginVersion=0.51.0
# x-release-please-end

# The oldest supported platform: its LSP API sends the plugin's requests through the server (`sendRequestSync`)
# and lists the service in the Language Services widget.
platformType=WS
platformVersion=2024.1
pluginSinceBuild=241
# The IDEs verifyPlugin checks: the oldest supported WebStorm, and the latest WebStorm, IntelliJ IDEA Ultimate and Rider.
verifyIdes=WS:2024.1,WS:2026.2.3,IU:2026.2.3,RD:2026.2.2
# The platform's test framework is published with IntelliJ IDEA's build numbers: the first of 2024.1,
# just after WebStorm 2024.1's own build, so it is not found by matching that build.
platformTestFrameworkVersion=241.14494.238

kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true
