<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title data-i18n="runs_title">Runs · Piwi Picker</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --surface: #f9fafb;
        --fg: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #7c3aed;
        --accent-fg: #6d28d9;
        --ok: #059669;
        --warn: #b45309;
        --stopped: #b45309;
        --running: #0369a1;
        --error: #dc2626;
        --row-hover: rgba(100, 116, 139, 0.12);
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111827;
          --surface: #1f2937;
          --fg: #f9fafb;
          --muted: #9ca3af;
          --border: #374151;
          --accent-fg: #c4b5fd;
          --ok: #34d399;
          --warn: #fbbf24;
          --stopped: #fbbf24;
          --running: #7dd3fc;
          --error: #f87171;
          --row-hover: rgba(148, 163, 184, 0.16);
        }
      }
      /* An element with the `hidden` attribute is hidden, whatever `display` a rule below gives it. */
      [hidden] {
        display: none !important;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        padding: 12px 14px 16px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      header img {
        border-radius: 5px;
      }
      h1 {
        flex: 1;
        margin: 0;
        font-size: 15px;
        line-height: 20px;
      }
      /* Which editor windows the window follows: a line under the title. */
      .hubs {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: -4px 0 10px;
        font-size: 11.5px;
        line-height: 16px;
        color: var(--muted);
      }
      .hubs > .piwi-icon {
        width: 12px;
        height: 12px;
        color: var(--ok);
      }
      .hubs.waiting > .piwi-icon {
        color: var(--warn);
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /* Nothing to show: why, and what to do. */
      .empty {
        padding: 14px;
        border: 1px dashed var(--border);
        border-radius: 10px;
        color: var(--muted);
      }
      .empty p {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin: 0 0 10px;
        line-height: 20px;
        color: var(--fg);
      }
      .empty p > .piwi-icon {
        width: 16px;
        height: 16px;
        margin-top: 2px;
        color: var(--accent-fg);
      }
      .empty .piwi-actions:empty {
        display: none;
      }
      .run {
        margin-bottom: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        overflow: hidden;
      }
      /* An ended run: its frame dashed and its names muted, each in a color that keeps its contrast. */
      .run.ended {
        border-style: dashed;
      }
      .run.ended h2,
      .run.ended .test {
        color: var(--muted);
      }
      .run-head {
        padding: 9px 12px 8px;
        border-bottom: 1px solid var(--border);
      }
      .run-title {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      h2 {
        flex: 1;
        min-width: 0;
        margin: 0;
        font-size: 13.5px;
        line-height: 18px;
        overflow-wrap: anywhere;
      }
      .client {
        flex-shrink: 0;
        font-size: 11px;
        color: var(--muted);
      }
      .command {
        display: block;
        margin-top: 3px;
        font: 11px/16px var(--mono);
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .run-ended {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        padding: 8px 12px;
        color: var(--muted);
      }
      .run-ended > .piwi-icon {
        width: 14px;
        height: 14px;
        color: var(--ok);
      }
      .workers {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .worker {
        padding: 10px 12px 12px;
        background: var(--bg);
      }
      .worker + .worker {
        border-top: 1px solid var(--border);
      }
      .state {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0 0 4px;
        font-size: 12px;
        font-weight: 600;
        line-height: 16px;
        color: var(--running);
      }
      .state > .piwi-icon {
        width: 14px;
        height: 14px;
      }
      .state .worker-number {
        margin-left: auto;
        font-weight: 400;
        color: var(--muted);
      }
      .worker[data-state='stopped'] .state {
        color: var(--stopped);
      }
      .worker[data-state='between'] .state {
        color: var(--muted);
      }
      .test {
        margin: 0;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .meta {
        margin: 0;
        font-size: 11.5px;
        color: var(--muted);
      }
      .note {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        margin: 6px 0 0;
        font-size: 11.5px;
        line-height: 16px;
        color: var(--muted);
      }
      .note > .piwi-icon {
        width: 12px;
        height: 12px;
        margin-top: 2px;
      }
      /* Where the test stands: the call about to run, and its file and line. */
      .stop {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 8px;
        margin: 8px 0;
        font-size: 12px;
      }
      .stop dt {
        color: var(--muted);
      }
      .stop dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .stop .place {
        font-family: var(--mono);
        font-size: 11.5px;
      }
      /* The stopped page: an image the hub took, never a page of its own. */
      .page {
        margin: 0 0 8px;
      }
      .page img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
      }
      .page p {
        margin: 0;
        font-size: 11.5px;
        color: var(--muted);
      }
      /* Why a live view ended or was refused, that it starts, and how its input works. */
      .page .view-note {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        margin-top: 6px;
        line-height: 16px;
      }
      .view-note > .piwi-icon {
        flex-shrink: 0;
        width: 12px;
        height: 12px;
        margin-top: 2px;
      }
      /* Watch live and Pick on the image, above the image. */
      .page-tools {
        margin-bottom: 6px;
      }
      /* The image, or the live view in its place: the width of the window, its aspect kept. */
      .page-frame {
        position: relative;
      }
      .page img.live:focus {
        outline: 2px solid var(--accent-fg);
        outline-offset: 2px;
      }
      /* Pick on the image waits for a click. */
      .page[data-picking] img {
        cursor: crosshair;
      }
      /* The live view's badge: still, in a red that keeps its white text's contrast in both schemes. */
      .live-badge {
        position: absolute;
        top: 6px;
        left: 6px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 6px 1px 4px;
        border-radius: 4px;
        background: #b91c1c;
        color: #ffffff;
        font-size: 10.5px;
        font-weight: 700;
        line-height: 16px;
        pointer-events: none;
      }
      .live-badge > .piwi-icon {
        width: 10px;
        height: 10px;
      }
      /* The controls that steer the test, then the code a stop can write, on a row of their own. */
      .controls {
        display: grid;
        gap: 6px;
        margin-top: 8px;
      }
      /* A test held where it failed: a stop, not a breakpoint. */
      .worker[data-failed] .state {
        color: var(--error);
      }
      /* A failure's error, its lines as it states them. */
      .stop .error {
        overflow-wrap: anywhere;
        white-space: pre-line;
      }
      /* A command on its way: the buttons wait for its answer, and keep the focus. */
      .piwi-btn[aria-disabled='true'] {
        opacity: 0.5;
        cursor: default;
      }
      /* Mock a request while its list of requests is open under it. */
      .piwi-btn[aria-expanded='true'] {
        background: var(--piwi-btn-pressed-bg);
        border-color: var(--piwi-btn-pressed-border);
      }
      .piwi-btn[aria-disabled='true']:hover {
        background: var(--piwi-btn-bg);
        border-color: var(--piwi-btn-border);
      }
      /* What a command answered when it was not done. */
      .answer {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        margin: 6px 0 0;
        font-size: 12px;
        line-height: 16px;
        color: var(--error);
      }
      .answer:empty {
        display: none;
      }
      .answer > .piwi-icon {
        width: 12px;
        height: 12px;
        margin-top: 2px;
      }
      /* The code went to the editor to write. */
      .note.sent > .piwi-icon {
        color: var(--ok);
      }
      /* What to review in the code sent to the editor: a line each, under the sentence that says it was sent. */
      .warnings {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .warnings .note {
        margin-top: 4px;
        overflow-wrap: anywhere;
      }
      .warnings .note > .piwi-icon {
        color: var(--warn);
      }
      /* The requests a stopped test kept, to choose the one to mock: one row each, scrolled within its box. */
      .requests {
        margin-top: 8px;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }
      .requests-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding-left: 4px;
      }
      .requests-title {
        flex: 1;
        min-width: 0;
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        line-height: 16px;
      }
      .requests .note {
        margin: 4px;
      }
      .requests-filter {
        display: block;
        width: 100%;
        margin: 4px 0 6px;
        padding: 4px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
        font-size: 12px;
      }
      .requests-filter:focus-visible {
        outline: 2px solid var(--accent-fg);
        outline-offset: 1px;
      }
      .request-list {
        max-height: 216px;
        margin: 0;
        padding: 0;
        list-style: none;
        overflow-y: auto;
      }
      .request {
        display: flex;
        flex-direction: column;
        gap: 1px;
        width: 100%;
        min-width: 0;
        padding: 5px 6px;
        border: none;
        border-radius: 6px;
        background: none;
        color: inherit;
        font: inherit;
        text-align: start;
        cursor: pointer;
      }
      .request:hover {
        background: var(--row-hover);
      }
      .request:focus-visible {
        outline: 2px solid var(--accent-fg);
        outline-offset: -2px;
      }
      .request[aria-disabled='true'] {
        opacity: 0.5;
        cursor: default;
      }
      .request-line {
        display: flex;
        gap: 6px;
        min-width: 0;
        font-size: 12px;
        line-height: 16px;
      }
      .request-line .method {
        flex-shrink: 0;
        font: 600 11px/16px var(--mono);
        color: var(--accent-fg);
      }
      /* The address cut to the row's width: the whole of it is in the row's tooltip and its name. */
      .request-line .path {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font: 11.5px/16px var(--mono);
      }
      .request-line .piwi-url {
        padding: 0;
        border: none;
        background: none;
        font: inherit;
      }
      .request-facts {
        font-size: 11px;
        line-height: 15px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .request-facts .failed {
        color: var(--error);
        font-weight: 600;
      }
      footer {
        margin-top: 4px;
      }
      /* The run shortcut: its key, or that it has none, and the button to the browser's shortcuts page. */
      .shortcut {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        margin-bottom: 6px;
      }
      .shortcut .note {
        flex: 1 1 220px;
        margin: 0;
      }
      kbd {
        padding: 0 4px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--surface);
        color: var(--fg);
        font: 11px/16px var(--mono);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon-32.png" width="18" height="18" alt="" />
        <h1 data-i18n="runs_heading">Your editor’s runs</h1>
      </header>
      <p id="hubs" class="hubs" hidden></p>
      <!-- Says what changed, for a screen reader: a test stopped, went on, a run ended. -->
      <p id="announce" class="visually-hidden" role="status" aria-live="polite"></p>
      <div id="empty" class="empty" hidden>
        <p id="empty-text"></p>
        <div id="empty-actions" class="piwi-actions"></div>
      </div>
      <div id="runs"></div>
      <footer>
        <div id="shortcut" class="shortcut" hidden>
          <p id="shortcut-text" class="note"></p>
          <div id="shortcut-actions" class="piwi-actions"></div>
        </div>
        <p class="note" data-i18n="runs_runToCursor" data-icon="info">Run to Cursor is in the editor, which has the file.</p>
      </footer>
    </main>
    <script type="module" src="src/runs/main.ts"></script>
  </body>
</html>
