<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Piwi Dashboard</title>
  <script>
    // GitHub Pages serves this page for any URL with no file behind it, and
    // offers no server-side redirects. A moved page answers at its old URL with
    // a redirect page of its own (.vitepress/moved-pages.ts), never here.
    //
    // The demo SPA (client-side only): every deep link lands here, so the
    // intended path is saved in sessionStorage and the visitor bounced to the
    // SPA entry point for Vue Router to render. Anything else goes to the
    // documentation root.
    ;(function () {
      const demoBase = '/demo'
      const path = window.location.pathname

      if (path === demoBase || path.startsWith(demoBase + '/')) {
        const relativePath = path.slice(demoBase.length) || '/'
        sessionStorage.setItem('spa:redirect', relativePath + window.location.search + window.location.hash)
        window.location.replace(demoBase + '/')
        return
      }

      window.location.replace('/')
    })()
  </script>
</head>
<body></body>
</html>
