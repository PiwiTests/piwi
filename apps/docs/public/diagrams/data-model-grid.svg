  <text class="mono m" x="36" y="261">checkout.spec.ts</text>
  <rect class="chip" x="248" y="218" width="150" height="56" rx="8"/>
  <rect class="okd" x="294" y="235" width="22" height="22" rx="5"/>
  <rect class="okd" x="330" y="235" width="22" height="22" rx="5"/>
