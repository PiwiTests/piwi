  <text class="l ink" x="36" y="366">lists past orders</text>
  <text class="mono m" x="36" y="385">orders.spec.ts</text>
  <rect class="chip" x="248" y="342" width="150" height="56" rx="8"/>
  <rect class="okd" x="294" y="359" width="22" height="22" rx="5"/>
