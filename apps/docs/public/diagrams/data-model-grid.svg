  <!-- One failure cluster: the same error, across test cases and runs -->
  <path class="clu" d="M 560 214 L 876 214 L 876 340 L 718 340 L 718 277 L 560 277 Z"/>

  <!-- Legend -->
  <rect class="okd" x="22" y="415" width="18" height="18" rx="4"/>
  <rect class="fcd" x="46" y="415" width="18" height="18" rx="4"/>
  <text class="l" x="74" y="430">An execution: one attempt of one test case, on one browser, in one run. A retry is another one.</text>
  <rect class="clu" x="22" y="443" width="42" height="18" rx="4"/>
  <text class="l" x="74" y="458">A failure cluster: the executions that failed the same way, whatever their test case or run.</text>
</svg>
