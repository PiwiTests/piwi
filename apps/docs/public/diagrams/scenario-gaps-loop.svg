<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
  .bg{fill:#fcfcfd;stroke:#e4e7ec}
  .t{fill:#101828;font-weight:700;font-size:19px}
  .s{fill:#475467;font-size:14px}
  .h{fill:#667085;font-size:12.5px;font-weight:700;letter-spacing:.05em}
  .lb{fill:#344054;font-size:15px;font-weight:600}
  .l{fill:#475467;font-size:13.5px}
  .m{fill:#667085;font-size:12.5px}
  .b{font-weight:600}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre}
  .ink{fill:#344054} .numw{fill:#ffffff}
  .box{fill:#ffffff;stroke:#d0d5dd}
  .chip{fill:#f9fafb;stroke:#d0d5dd}
  .hd{fill:#f2f4f7}
  .cap{fill:#f2f4f7;stroke:#d0d5dd}
  .rule{fill:none;stroke:#e4e7ec}
  .edge{fill:none;stroke:#667085;stroke-width:1.4}
  .dash{fill:none;stroke:#98a2b3;stroke-width:1.3;stroke-dasharray:5 4}
  .acc{fill:none;stroke:#4353ff;stroke-width:1.6}
  .accd{fill:none;stroke:#4353ff;stroke-width:1.4;stroke-dasharray:5 4}
  .acct{fill:#4353ff;font-size:13px} .ac{fill:#4353ff}
  .et{fill:#475467;font-size:13px}
  .arr{fill:#667085} .arrd{fill:#98a2b3} .arra{fill:#4353ff}
  .ab{fill:#eef1ff;stroke:#c7ceff} .abt{fill:#2a3aa8} .abl{fill:#3f4b9e} .abo{fill:none;stroke:#4353ff;stroke-width:1.5}
  .ok{fill:#ecfdf3;stroke:#75e0a7} .okt{fill:#067647} .okd{fill:#12b76a}
  .bs{fill:#fffaeb;stroke:#fec84b} .bst{fill:#b54708}
  .fc{fill:#fef3f2;stroke:#fda29b} .fct{fill:#b42318} .fcd{fill:#f04438}
  .fr{fill:#fff6ed;stroke:#fd853a} .frt{fill:#c4320a}
  .mu{fill:#f2f4f7;stroke:#d0d5dd} .mud{fill:#d0d5dd}
  .dbx{fill:none;stroke:#d0d5dd;stroke-dasharray:5 4}
  .clu{fill:#4353ff;fill-opacity:.06;stroke:#4353ff;stroke-width:1.8;stroke-dasharray:6 4;stroke-linejoin:round}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161b26;stroke:#333741}
    .t{fill:#f5f5f6} .s{fill:#94969c} .h{fill:#85888e}
    .lb{fill:#ececed} .l{fill:#cecfd2} .m{fill:#94969c} .ink{fill:#ececed} .numw{fill:#161b26}
    .box{fill:#1f242f;stroke:#333741} .chip{fill:#262b36;stroke:#333741} .hd{fill:#262b36}
    .cap{fill:#262b36;stroke:#4a4f5a}
    .rule{stroke:#333741}
    .edge{stroke:#94969c} .arr{fill:#94969c}
    .dash{stroke:#61646c} .arrd{fill:#61646c}
    .acc,.accd{stroke:#8098f9} .acct,.ac{fill:#8098f9} .arra{fill:#8098f9}
    .et{fill:#94969c}
    .ab{fill:#1c2142;stroke:#3b4699} .abt{fill:#c7d0ff} .abl{fill:#a4b0f0} .abo{stroke:#8098f9}
    .ok{fill:#0b2418;stroke:#079455} .okt{fill:#75e0a7} .okd{fill:#17b26a}
    .bs{fill:#2b1d07;stroke:#ca8504} .bst{fill:#fec84b}
    .fc{fill:#2d1210;stroke:#d92d20} .fct{fill:#fda29b} .fcd{fill:#f04438}
    .fr{fill:#2b170c;stroke:#e04f16} .frt{fill:#f7b27a}
    .mu{fill:#262b36;stroke:#333741} .mud{fill:#61646c}
    .dbx{stroke:#61646c}
    .clu{fill:#8098f9;fill-opacity:.1;stroke:#8098f9}
  }
</style>
  <defs>
    <marker id="sgln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arr" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="sgld" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrd" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="sgla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arra" d="M 0 1 L 9 5 L 0 9 z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="919" height="509" rx="12"/>
  <text class="t" x="24" y="38">From runs to proposed tests</text>
  <text class="s" x="24" y="62">The Test Map is rebuilt from what runs already record; detectors read it, and every verdict tunes them.</text>

  <!-- 1 · Sources -->
  <rect class="box" x="22" y="88" width="268" height="196" rx="8"/>
  <path class="hd" d="M 22.5 120 L 22.5 96 Q 22.5 88.5 30 88.5 L 282 88.5 Q 289.5 88.5 289.5 96 L 289.5 120 Z"/>
  <text class="lb" x="38" y="109">1 · Sources</text>
  <text class="l" x="38" y="144"><tspan class="b ink">each run:</tspan> requests and the page</text>
  <text class="l" x="38" y="163">it ends on</text>
  <text class="l" x="38" y="182"><tspan class="b ink">opt-in:</tspan> page inventory and</text>
  <text class="l" x="38" y="201">server spans</text>
  <text class="l" x="38" y="220"><tspan class="b ink">declared:</tspan> OpenAPI and</text>
  <text class="l" x="38" y="239">piwi.manifest.json</text>
  <text class="m" x="38" y="268">also probe runs and PR diffs</text>

  <!-- 2 · Test Map -->
  <rect class="box" x="326" y="88" width="268" height="196" rx="8"/>
  <path class="hd" d="M 326.5 120 L 326.5 96 Q 326.5 88.5 334 88.5 L 586 88.5 Q 593.5 88.5 593.5 96 L 593.5 120 Z"/>
  <text class="lb" x="342" y="109">2 · Test Map</text>
  <text class="l" x="342" y="144"><tspan class="b ink">nodes:</tspan> pages, controls, routes,</text>
  <text class="l" x="342" y="163">handlers, dependencies, features</text>
  <text class="l" x="342" y="182"><tspan class="b ink">edges:</tspan> reaches, checks, loads,</text>
  <text class="l" x="342" y="201">links, contains, handled-by, calls</text>
  <text class="m" x="342" y="268">one graph per project</text>

  <!-- 3 · Detectors -->
  <rect class="box" x="630" y="88" width="268" height="196" rx="8"/>
  <path class="hd" d="M 630.5 120 L 630.5 96 Q 630.5 88.5 638 88.5 L 890 88.5 Q 897.5 88.5 897.5 96 L 897.5 120 Z"/>
  <text class="lb" x="646" y="109">3 · Detectors</text>
  <text class="l" x="646" y="144">one rule per kind of gap, read</text>
  <text class="l" x="646" y="163">from the graph and the last 30</text>
  <text class="l" x="646" y="182">runs</text>
  <text class="m" x="646" y="268">after every run, and nightly</text>
  <path class="acc" d="M 290 186 L 324 186" marker-end="url(#sgla)"/>
  <path class="acc" d="M 594 186 L 628 186" marker-end="url(#sgla)"/>

  <!-- 4 · Ranking -->
  <rect class="box" x="630" y="336" width="268" height="114" rx="8"/>
  <path class="hd" d="M 630.5 368 L 630.5 344 Q 630.5 336.5 638 336.5 L 890 336.5 Q 897.5 336.5 897.5 344 L 897.5 368 Z"/>
  <text class="lb" x="646" y="357">4 · Ranking</text>
  <text class="l" x="646" y="392">confidence × exposure: churn,</text>
  <text class="l" x="646" y="411">age, escape history, priority</text>
  <text class="m" x="646" y="434">counts, not percentages</text>

  <!-- 5 · Where it shows -->
  <rect class="box" x="326" y="336" width="268" height="114" rx="8"/>
  <path class="hd" d="M 326.5 368 L 326.5 344 Q 326.5 336.5 334 336.5 L 586 336.5 Q 593.5 336.5 593.5 344 L 593.5 368 Z"/>
  <text class="lb" x="342" y="357">5 · Where it shows</text>
  <text class="l" x="342" y="392">the Gaps tab, the PR comment,</text>
  <text class="l" x="342" y="411">MCP tools, the Gaps digest</text>
  <text class="m" x="342" y="434">a draft test per gap</text>

  <!-- Your verdict -->
  <rect class="box" x="22" y="336" width="268" height="114" rx="8"/>
  <path class="hd" d="M 22.5 368 L 22.5 344 Q 22.5 336.5 30 336.5 L 282 336.5 Q 289.5 336.5 289.5 344 L 289.5 368 Z"/>
  <text class="lb" x="38" y="357">Your verdict</text>
  <text class="l" x="38" y="392">accept, snooze, dismiss,</text>
  <text class="l" x="38" y="411">or covered by</text>
  <path class="acc" d="M 764 284 L 764 334" marker-end="url(#sgla)"/>
  <path class="acc" d="M 630 402 L 596 402" marker-end="url(#sgla)"/>
  <path class="edge" d="M 326 402 L 292 402" marker-end="url(#sgln)"/>

  <!-- What a verdict changes -->
  <path class="edge" d="M 122 450 L 122 484 L 910 484 L 910 228 L 900 228" marker-end="url(#sgln)"/>
  <text class="et" x="500" y="476" text-anchor="middle">each verdict counts for or against its detector; below 60% over 20 verdicts, it mutes itself</text>
  <path class="dash" d="M 250 336 L 250 310 L 386 310 L 386 286" marker-end="url(#sgld)"/>
  <text class="m" x="22" y="316">covered by: a manual reaches edge</text>
</svg>
