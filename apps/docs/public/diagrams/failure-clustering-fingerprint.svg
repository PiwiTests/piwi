<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
  .bg{fill:#fcfcfd;stroke:#e4e7ec}
  .t{fill:#101828;font-weight:700;font-size:19px}
  .s{fill:#475467;font-size:14px}
  .h{fill:#667085;font-size:12.5px;font-weight:700;letter-spacing:.05em}
  .lb{fill:#344054;font-size:15px;font-weight:600}
  .l{fill:#475467;font-size:13.5px}
  .m{fill:#667085;font-size:12.5px}
  .b{font-weight:600}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre}
  .ink{fill:#344054} .numw{fill:#ffffff}
  .box{fill:#ffffff;stroke:#d0d5dd}
  .chip{fill:#f9fafb;stroke:#d0d5dd}
  .hd{fill:#f2f4f7}
  .cap{fill:#f2f4f7;stroke:#d0d5dd}
  .rule{fill:none;stroke:#e4e7ec}
  .edge{fill:none;stroke:#667085;stroke-width:1.4}
  .dash{fill:none;stroke:#98a2b3;stroke-width:1.3;stroke-dasharray:5 4}
  .acc{fill:none;stroke:#4353ff;stroke-width:1.6}
  .accd{fill:none;stroke:#4353ff;stroke-width:1.4;stroke-dasharray:5 4}
  .acct{fill:#4353ff;font-size:13px} .ac{fill:#4353ff}
  .et{fill:#475467;font-size:13px}
  .arr{fill:#667085} .arrd{fill:#98a2b3} .arra{fill:#4353ff}
  .ab{fill:#eef1ff;stroke:#c7ceff} .abt{fill:#2a3aa8} .abl{fill:#3f4b9e} .abo{fill:none;stroke:#4353ff;stroke-width:1.5}
  .ok{fill:#ecfdf3;stroke:#75e0a7} .okt{fill:#067647} .okd{fill:#12b76a}
  .bs{fill:#fffaeb;stroke:#fec84b} .bst{fill:#b54708}
  .fc{fill:#fef3f2;stroke:#fda29b} .fct{fill:#b42318} .fcd{fill:#f04438}
  .fr{fill:#fff6ed;stroke:#fd853a} .frt{fill:#c4320a}
  .mu{fill:#f2f4f7;stroke:#d0d5dd} .mud{fill:#d0d5dd}
  .dbx{fill:none;stroke:#d0d5dd;stroke-dasharray:5 4}
  .clu{fill:#4353ff;fill-opacity:.06;stroke:#4353ff;stroke-width:1.8;stroke-dasharray:6 4;stroke-linejoin:round}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161b26;stroke:#333741}
    .t{fill:#f5f5f6} .s{fill:#94969c} .h{fill:#85888e}
    .lb{fill:#ececed} .l{fill:#cecfd2} .m{fill:#94969c} .ink{fill:#ececed} .numw{fill:#161b26}
    .box{fill:#1f242f;stroke:#333741} .chip{fill:#262b36;stroke:#333741} .hd{fill:#262b36}
    .cap{fill:#262b36;stroke:#4a4f5a}
    .rule{stroke:#333741}
    .edge{stroke:#94969c} .arr{fill:#94969c}
    .dash{stroke:#61646c} .arrd{fill:#61646c}
    .acc,.accd{stroke:#8098f9} .acct,.ac{fill:#8098f9} .arra{fill:#8098f9}
    .et{fill:#94969c}
    .ab{fill:#1c2142;stroke:#3b4699} .abt{fill:#c7d0ff} .abl{fill:#a4b0f0} .abo{stroke:#8098f9}
    .ok{fill:#0b2418;stroke:#079455} .okt{fill:#75e0a7} .okd{fill:#17b26a}
    .bs{fill:#2b1d07;stroke:#ca8504} .bst{fill:#fec84b}
    .fc{fill:#2d1210;stroke:#d92d20} .fct{fill:#fda29b} .fcd{fill:#f04438}
    .fr{fill:#2b170c;stroke:#e04f16} .frt{fill:#f7b27a}
    .mu{fill:#262b36;stroke:#333741} .mud{fill:#61646c}
    .dbx{stroke:#61646c}
    .clu{fill:#8098f9;fill-opacity:.1;stroke:#8098f9}
  }
</style>
  <defs>
    <marker id="fcn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arr" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="fcd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrd" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="fca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arra" d="M 0 1 L 9 5 L 0 9 z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="919" height="459" rx="12"/>
  <text class="t" x="24" y="38">Fingerprinting: every failure, zero configuration</text>
  <text class="s" x="24" y="62">The error text is normalized and hashed; the hash routes each failure to its cluster.</text>

  <!-- Raw error -->
  <rect class="box" x="22" y="88" width="252" height="166" rx="8"/>
  <path class="hd" d="M 22.5 120 L 22.5 96 Q 22.5 88.5 30 88.5 L 266 88.5 Q 273.5 88.5 273.5 96 L 273.5 120 Z"/>
  <text class="lb" x="38" y="109">Raw error text</text>
  <text class="mono ink" x="38" y="144">TimeoutError: locator.click:</text>
  <text class="mono ink" x="38" y="164">Timeout <tspan class="bst">30000</tspan>ms exceeded</text>
  <text class="mono ink" x="38" y="184">waiting for getByRole('row',</text>
  <text class="mono ink" x="38" y="204">  { name: <tspan class="bst">'Acme Corp'</tspan> })</text>
  <text class="m" x="38" y="236">at checkout.spec.ts:42:11</text>
  <path class="acc" d="M 274 180 L 352 180" marker-end="url(#fca)"/>
  <text class="acct" x="314" y="170" text-anchor="middle">normalize</text>

  <!-- Fingerprint input -->
  <rect class="box" x="354" y="88" width="262" height="236" rx="8"/>
  <path class="hd" d="M 354.5 120 L 354.5 96 Q 354.5 88.5 362 88.5 L 608 88.5 Q 615.5 88.5 615.5 96 L 615.5 120 Z"/>
  <text class="lb" x="370" y="109">Fingerprint input</text>
  <rect class="ab" x="370" y="130" width="70" height="22" rx="11"/>
  <text class="m b abt" x="405" y="145" text-anchor="middle">timeout</text>
  <text class="m" x="450" y="145">error category</text>
  <text class="mono ink" x="370" y="180">Timeout <tspan class="ac">&lt;N&gt;</tspan>ms exceeded</text>
  <text class="mono ink" x="370" y="200">waiting for getByRole('row',</text>
  <text class="mono ink" x="370" y="220">  { name: <tspan class="ac">&lt;STR&gt;</tspan> })</text>
  <path class="rule" d="M 370 240 L 600 240"/>
  <text class="m" x="370" y="260">stack frame kept for display, never</text>
  <text class="m" x="370" y="278">hashed, so one cause groups across</text>
  <text class="m" x="370" y="296">spec files</text>
  <path class="acc" d="M 616 180 L 688 180" marker-end="url(#fca)"/>
  <text class="acct" x="653" y="170" text-anchor="middle">SHA-256</text>

  <!-- Cluster -->
  <rect class="box" x="690" y="88" width="208" height="166" rx="8"/>
  <path class="hd" d="M 690.5 120 L 690.5 96 Q 690.5 88.5 698 88.5 L 890 88.5 Q 897.5 88.5 897.5 96 L 897.5 120 Z"/>
  <text class="lb" x="706" y="109">Failure cluster</text>
  <text class="mono ink" x="706" y="144">fingerprint 3f9c1a…</text>
  <text class="l" x="706" y="170">Same hash, or a recorded</text>
  <text class="l" x="706" y="189">merge alias, joins the</text>
  <text class="l" x="706" y="208">same cluster across tests,</text>
  <text class="l" x="706" y="227">spec files and runs.</text>

  <!-- Storage -->
  <path class="edge" d="M 794 254 L 794 284" marker-end="url(#fcn)"/>
  <path class="box" d="M 690 302 a 104 14 0 0 0 208 0 v 72 a 104 14 0 0 1 -208 0 z"/>
  <ellipse class="cap" cx="794" cy="302" rx="104" ry="14"/>
  <text class="lb" x="794" y="344" text-anchor="middle">failure_clusters</text>
  <text class="m" x="794" y="364" text-anchor="middle">one row per project and</text>
  <text class="m" x="794" y="380" text-anchor="middle">fingerprint; aliases reroute</text>
  <text class="m" x="794" y="396" text-anchor="middle">merged fingerprints</text>

  <!-- Masked tokens -->
  <text class="h" x="22" y="356">MASKED BEFORE HASHING</text>
  <text class="l" x="22" y="380">numbers and timeouts · URLs · emails · UUIDs · hex hashes ·</text>
  <text class="l" x="22" y="400">expected and received values · dynamic locator options ({ name: … })</text>
  <text class="l" x="22" y="420">The locator’s own target stays, so it still tells causes apart.</text>
</svg>
