<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 496" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
  .bg{fill:#fcfcfd;stroke:#e4e7ec}
  .t{fill:#101828;font-weight:700;font-size:19px}
  .s{fill:#475467;font-size:14px}
  .h{fill:#667085;font-size:12.5px;font-weight:700;letter-spacing:.05em}
  .lb{fill:#344054;font-size:15px;font-weight:600}
  .l{fill:#475467;font-size:13.5px}
  .m{fill:#667085;font-size:12.5px}
  .b{font-weight:600}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre}
  .ink{fill:#344054} .numw{fill:#ffffff}
  .box{fill:#ffffff;stroke:#d0d5dd}
  .chip{fill:#f9fafb;stroke:#d0d5dd}
  .hd{fill:#f2f4f7}
  .cap{fill:#f2f4f7;stroke:#d0d5dd}
  .rule{fill:none;stroke:#e4e7ec}
  .edge{fill:none;stroke:#667085;stroke-width:1.4}
  .dash{fill:none;stroke:#98a2b3;stroke-width:1.3;stroke-dasharray:5 4}
  .acc{fill:none;stroke:#4353ff;stroke-width:1.6}
  .accd{fill:none;stroke:#4353ff;stroke-width:1.4;stroke-dasharray:5 4}
  .acct{fill:#4353ff;font-size:13px} .ac{fill:#4353ff}
  .et{fill:#475467;font-size:13px}
  .arr{fill:#667085} .arrd{fill:#98a2b3} .arra{fill:#4353ff}
  .ab{fill:#eef1ff;stroke:#c7ceff} .abt{fill:#2a3aa8} .abl{fill:#3f4b9e} .abo{fill:none;stroke:#4353ff;stroke-width:1.5}
  .ok{fill:#ecfdf3;stroke:#75e0a7} .okt{fill:#067647} .okd{fill:#12b76a}
  .bs{fill:#fffaeb;stroke:#fec84b} .bst{fill:#b54708}
  .fc{fill:#fef3f2;stroke:#fda29b} .fct{fill:#b42318} .fcd{fill:#f04438}
  .fr{fill:#fff6ed;stroke:#fd853a} .frt{fill:#c4320a}
  .mu{fill:#f2f4f7;stroke:#d0d5dd} .mud{fill:#d0d5dd}
  .dbx{fill:none;stroke:#d0d5dd;stroke-dasharray:5 4}
  .clu{fill:#4353ff;fill-opacity:.06;stroke:#4353ff;stroke-width:1.8;stroke-dasharray:6 4;stroke-linejoin:round}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161b26;stroke:#333741}
    .t{fill:#f5f5f6} .s{fill:#94969c} .h{fill:#85888e}
    .lb{fill:#ececed} .l{fill:#cecfd2} .m{fill:#94969c} .ink{fill:#ececed} .numw{fill:#161b26}
    .box{fill:#1f242f;stroke:#333741} .chip{fill:#262b36;stroke:#333741} .hd{fill:#262b36}
    .cap{fill:#262b36;stroke:#4a4f5a}
    .rule{stroke:#333741}
    .edge{stroke:#94969c} .arr{fill:#94969c}
    .dash{stroke:#61646c} .arrd{fill:#61646c}
    .acc,.accd{stroke:#8098f9} .acct,.ac{fill:#8098f9} .arra{fill:#8098f9}
    .et{fill:#94969c}
    .ab{fill:#1c2142;stroke:#3b4699} .abt{fill:#c7d0ff} .abl{fill:#a4b0f0} .abo{stroke:#8098f9}
    .ok{fill:#0b2418;stroke:#079455} .okt{fill:#75e0a7} .okd{fill:#17b26a}
    .bs{fill:#2b1d07;stroke:#ca8504} .bst{fill:#fec84b}
    .fc{fill:#2d1210;stroke:#d92d20} .fct{fill:#fda29b} .fcd{fill:#f04438}
    .fr{fill:#2b170c;stroke:#e04f16} .frt{fill:#f7b27a}
    .mu{fill:#262b36;stroke:#333741} .mud{fill:#61646c}
    .dbx{stroke:#61646c}
    .clu{fill:#8098f9;fill-opacity:.1;stroke:#8098f9}
  }
</style>
  <defs>
    <marker id="smn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arr" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="smd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrd" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="sma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arra" d="M 0 1 L 9 5 L 0 9 z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="919" height="495" rx="12"/>
  <text class="t" x="24" y="38">Semantic merging: the optional embedding layer</text>
  <text class="s" x="24" y="62">After each run, clusters without an up-to-date vector are embedded and compared to the open clusters.</text>

  <!-- Pipeline -->
  <rect class="box" x="22" y="88" width="268" height="84" rx="8"/>
  <text class="lb" x="38" y="112">Clusters first seen in this run</text>
  <text class="m" x="38" y="136">plus older open clusters</text>
  <text class="m" x="38" y="153">with no usable vector yet</text>
  <path class="acc" d="M 290 130 L 344 130" marker-end="url(#sma)"/>
  <text class="acct" x="318" y="121" text-anchor="middle">embed</text>
  <rect class="ab" x="346" y="88" width="240" height="84" rx="8"/>
  <text class="lb abt" x="466" y="114" text-anchor="middle">Cleaned error text → vector</text>
  <text class="m abl" x="466" y="136" text-anchor="middle">ANSI, stack noise and</text>
  <text class="m abl" x="466" y="153" text-anchor="middle">volatile values removed</text>
  <path class="acc" d="M 586 130 L 640 130" marker-end="url(#sma)"/>
  <rect class="box" x="642" y="88" width="256" height="84" rx="8"/>
  <text class="lb" x="658" y="112">Nearest open cluster</text>
  <text class="m" x="658" y="136">cosine similarity,</text>
  <text class="m" x="658" y="153">same embedding model only</text>

  <!-- Similarity bands -->
  <text class="h" x="460" y="218" text-anchor="middle">COSINE SIMILARITY OF THE CLOSEST PAIR</text>
  <path class="edge" d="M 770 172 L 770 228 M 180 228 L 770 228"/>
  <path class="edge" d="M 180 228 L 180 256" marker-end="url(#smn)"/>
  <path class="edge" d="M 490 228 L 490 256" marker-end="url(#smn)"/>
  <path class="edge" d="M 770 228 L 770 256" marker-end="url(#smn)"/>
  <rect class="chip" x="22" y="258" width="316" height="44" rx="8"/>
  <text class="l" x="180" y="285" text-anchor="middle">kept separate</text>
  <rect class="bs" x="342" y="258" width="296" height="44" rx="8"/>
  <text class="l b bst" x="490" y="285" text-anchor="middle">ambiguous band</text>
  <rect class="ok" x="642" y="258" width="256" height="44" rx="8"/>
  <text class="l b okt" x="770" y="285" text-anchor="middle">auto-merge</text>
  <text class="mono m" x="340" y="320" text-anchor="middle">0.80</text>
  <text class="mono m" x="640" y="320" text-anchor="middle">0.92</text>

  <!-- Outcomes -->
  <path class="edge" d="M 180 302 L 180 338" marker-end="url(#smn)"/>
  <path class="edge" d="M 490 302 L 490 338" marker-end="url(#smn)"/>
  <path class="edge" d="M 770 302 L 770 338" marker-end="url(#smn)"/>
  <rect class="box" x="22" y="340" width="316" height="132" rx="8"/>
  <text class="lb" x="38" y="364">Kept as two clusters</text>
  <text class="l" x="38" y="388">below 0.80, or a pair already</text>
  <text class="l" x="38" y="407">decided against: a rejected</text>
  <text class="l" x="38" y="426">suggestion, a hand split, or</text>
  <text class="l" x="38" y="445">the model’s “not one cause”</text>
  <rect class="box" x="342" y="340" width="296" height="132" rx="8"/>
  <text class="lb" x="358" y="364">A model adjudicates the pair</text>
  <text class="m" x="358" y="388">it sees locators, affected tests, overlap</text>
  <text class="l" x="358" y="412">one cause, sure → <tspan class="b okt">merge</tspan></text>
  <text class="l" x="358" y="431">unsure, or no model → <tspan class="b bst">suggestion</tspan></text>
  <text class="l" x="358" y="450">not one cause → kept apart</text>
  <rect class="box" x="642" y="340" width="256" height="132" rx="8"/>
  <text class="lb" x="658" y="364">Merged into the older cluster</text>
  <text class="l" x="658" y="388">keeps its triage status and</text>
  <text class="l" x="658" y="407">notes; a fingerprint alias</text>
  <text class="l" x="658" y="426">sends future occurrences</text>
  <text class="l" x="658" y="445">to the survivor</text>
</svg>
