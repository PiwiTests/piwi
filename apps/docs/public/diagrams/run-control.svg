<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 468" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
  .bg{fill:#fcfcfd;stroke:#e4e7ec}
  .t{fill:#101828;font-weight:700;font-size:19px}
  .s{fill:#475467;font-size:14px}
  .h{fill:#667085;font-size:12.5px;font-weight:700;letter-spacing:.05em}
  .lb{fill:#344054;font-size:15px;font-weight:600}
  .l{fill:#475467;font-size:13.5px}
  .m{fill:#667085;font-size:12.5px}
  .b{font-weight:600}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre}
  .ink{fill:#344054} .numw{fill:#ffffff}
  .box{fill:#ffffff;stroke:#d0d5dd}
  .chip{fill:#f9fafb;stroke:#d0d5dd}
  .hd{fill:#f2f4f7}
  .cap{fill:#f2f4f7;stroke:#d0d5dd}
  .rule{fill:none;stroke:#e4e7ec}
  .edge{fill:none;stroke:#667085;stroke-width:1.4}
  .dash{fill:none;stroke:#98a2b3;stroke-width:1.3;stroke-dasharray:5 4}
  .acc{fill:none;stroke:#4353ff;stroke-width:1.6}
  .accd{fill:none;stroke:#4353ff;stroke-width:1.4;stroke-dasharray:5 4}
  .acct{fill:#4353ff;font-size:13px} .ac{fill:#4353ff}
  .et{fill:#475467;font-size:13px}
  .arr{fill:#667085} .arrd{fill:#98a2b3} .arra{fill:#4353ff}
  .ab{fill:#eef1ff;stroke:#c7ceff} .abt{fill:#2a3aa8} .abl{fill:#3f4b9e} .abo{fill:none;stroke:#4353ff;stroke-width:1.5}
  .ok{fill:#ecfdf3;stroke:#75e0a7} .okt{fill:#067647} .okd{fill:#12b76a}
  .bs{fill:#fffaeb;stroke:#fec84b} .bst{fill:#b54708}
  .fc{fill:#fef3f2;stroke:#fda29b} .fct{fill:#b42318} .fcd{fill:#f04438}
  .fr{fill:#fff6ed;stroke:#fd853a} .frt{fill:#c4320a}
  .mu{fill:#f2f4f7;stroke:#d0d5dd} .mud{fill:#d0d5dd}
  .dbx{fill:none;stroke:#d0d5dd;stroke-dasharray:5 4}
  .clu{fill:#4353ff;fill-opacity:.06;stroke:#4353ff;stroke-width:1.8;stroke-dasharray:6 4;stroke-linejoin:round}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161b26;stroke:#333741}
    .t{fill:#f5f5f6} .s{fill:#94969c} .h{fill:#85888e}
    .lb{fill:#ececed} .l{fill:#cecfd2} .m{fill:#94969c} .ink{fill:#ececed} .numw{fill:#161b26}
    .box{fill:#1f242f;stroke:#333741} .chip{fill:#262b36;stroke:#333741} .hd{fill:#262b36}
    .cap{fill:#262b36;stroke:#4a4f5a}
    .rule{stroke:#333741}
    .edge{stroke:#94969c} .arr{fill:#94969c}
    .dash{stroke:#61646c} .arrd{fill:#61646c}
    .acc,.accd{stroke:#8098f9} .acct,.ac{fill:#8098f9} .arra{fill:#8098f9}
    .et{fill:#94969c}
    .ab{fill:#1c2142;stroke:#3b4699} .abt{fill:#c7d0ff} .abl{fill:#a4b0f0} .abo{stroke:#8098f9}
    .ok{fill:#0b2418;stroke:#079455} .okt{fill:#75e0a7} .okd{fill:#17b26a}
    .bs{fill:#2b1d07;stroke:#ca8504} .bst{fill:#fec84b}
    .fc{fill:#2d1210;stroke:#d92d20} .fct{fill:#fda29b} .fcd{fill:#f04438}
    .fr{fill:#2b170c;stroke:#e04f16} .frt{fill:#f7b27a}
    .mu{fill:#262b36;stroke:#333741} .mud{fill:#61646c}
    .dbx{stroke:#61646c}
    .clu{fill:#8098f9;fill-opacity:.1;stroke:#8098f9}
  }
</style>
  <defs>
    <marker id="rcn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arr" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="rcd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrd" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="rca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arra" d="M 0 1 L 9 5 L 0 9 z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="919" height="467" rx="12"/>
  <text class="t" x="24" y="38">How the pieces connect</text>
  <text class="s" x="24" y="62">A run the editor starts reports to the editor service; the editor and Piwi Picker are two views of it.</text>
  <text class="h" x="22" y="90">THE TEST RUN</text>
  <text class="h" x="388" y="90">YOUR EDITOR</text>
  <text class="h" x="652" y="90">WHERE YOU STEER IT</text>

  <!-- The run: its workers and the browser they drive. -->
  <rect class="box" x="22" y="104" width="282" height="266" rx="8"/>
  <path class="hd" d="M 22.5 136 L 22.5 112 Q 22.5 104.5 30 104.5 L 296 104.5 Q 303.5 104.5 303.5 112 L 303.5 136 Z"/>
  <text class="lb" x="38" y="125">A test run</text>
  <rect class="chip" x="38" y="150" width="250" height="60" rx="8"/>
  <text class="lb" x="54" y="174">Each worker</text>
  <text class="m" x="54" y="194">the capture fixtures, the reporter</text>
  <rect class="chip" x="38" y="294" width="250" height="60" rx="8"/>
  <text class="lb" x="54" y="318">The test’s browser</text>
  <text class="m" x="54" y="338">headed or headless</text>
  <path class="edge" d="M 56 210 L 56 292" marker-end="url(#rcn)"/>
  <text class="et" x="64" y="244">context.debugger:</text>
  <text class="et" x="64" y="261">pause, step, resume</text>
  <path class="dash" d="M 206 210 L 206 292" marker-end="url(#rcd)"/>
  <text class="m" x="214" y="244">pause bar,</text>
  <text class="m" x="214" y="261">at a stop only</text>

  <!-- The editor service, which holds the runs it started. -->
  <rect class="box" x="388" y="150" width="214" height="146" rx="8"/>
  <path class="hd" d="M 388.5 182 L 388.5 158 Q 388.5 150.5 396 150.5 L 594 150.5 Q 601.5 150.5 601.5 158 L 601.5 182 Z"/>
  <text class="lb" x="404" y="171">The editor service</text>
  <text class="l" x="404" y="206">each run it started, its</text>
  <text class="l" x="404" y="225">workers, where they stop</text>
  <text class="mono m" x="404" y="254">127.0.0.1 only</text>
  <text class="m" x="404" y="276">a token per service</text>
  <path class="acc" d="M 288 180 L 386 180" marker-start="url(#rca)" marker-end="url(#rca)"/>
  <text class="acct" x="346" y="170" text-anchor="middle">run channel</text>

  <!-- The surfaces. -->
  <rect class="box" x="652" y="104" width="246" height="104" rx="8"/>
  <text class="lb" x="668" y="128">VS Code, JetBrains IDEs</text>
  <text class="l" x="668" y="150">the paused line, the controls,</text>
  <text class="l" x="668" y="169">breakpoints; writes the code</text>
  <text class="m" x="668" y="192">Send to editor: the pairing</text>
  <rect class="box" x="652" y="270" width="246" height="118" rx="8"/>
  <text class="lb" x="668" y="294">Piwi Picker</text>
  <text class="l" x="668" y="316">in your own browser: the Runs</text>
  <text class="l" x="668" y="335">window, and a shortcut you set</text>
  <text class="m" x="668" y="358">Runs: Chrome, Edge, Firefox</text>
  <text class="m" x="668" y="374">global shortcut: Chrome, Edge</text>
  <path class="edge" d="M 604 196 L 650 160" marker-start="url(#rcn)" marker-end="url(#rcn)"/>
  <text class="et" x="612" y="160">LSP</text>
  <path class="acc" d="M 604 262 L 650 304" marker-start="url(#rca)" marker-end="url(#rca)"/>
  <text class="acct" x="642" y="318" text-anchor="end">WebSocket:</text>
  <text class="acct" x="642" y="334" text-anchor="end">origin, token</text>
  <path class="dash" d="M 864 270 L 864 210" marker-end="url(#rcd)"/>
  <text class="m" x="856" y="234" text-anchor="end">finds the services</text>
  <text class="m" x="856" y="249" text-anchor="end">through the pairing</text>
  <text class="l" x="22" y="428">The service takes an extension’s origin with the token its editor handed over: a page served from your machine is refused.</text>
  <text class="l" x="22" y="448">Nothing of Piwi is in the test’s page while it acts; the pause bar shows only while the test is stopped.</text>
</svg>
