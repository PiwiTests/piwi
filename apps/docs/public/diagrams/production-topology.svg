<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
  .bg{fill:#fcfcfd;stroke:#e4e7ec}
  .t{fill:#101828;font-weight:700;font-size:19px}
  .s{fill:#475467;font-size:14px}
  .h{fill:#667085;font-size:12.5px;font-weight:700;letter-spacing:.05em}
  .lb{fill:#344054;font-size:15px;font-weight:600}
  .l{fill:#475467;font-size:13.5px}
  .m{fill:#667085;font-size:12.5px}
  .b{font-weight:600}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre}
  .ink{fill:#344054} .numw{fill:#ffffff}
  .box{fill:#ffffff;stroke:#d0d5dd}
  .chip{fill:#f9fafb;stroke:#d0d5dd}
  .hd{fill:#f2f4f7}
  .cap{fill:#f2f4f7;stroke:#d0d5dd}
  .rule{fill:none;stroke:#e4e7ec}
  .edge{fill:none;stroke:#667085;stroke-width:1.4}
  .dash{fill:none;stroke:#98a2b3;stroke-width:1.3;stroke-dasharray:5 4}
  .acc{fill:none;stroke:#4353ff;stroke-width:1.6}
  .accd{fill:none;stroke:#4353ff;stroke-width:1.4;stroke-dasharray:5 4}
  .acct{fill:#4353ff;font-size:13px} .ac{fill:#4353ff}
  .et{fill:#475467;font-size:13px}
  .arr{fill:#667085} .arrd{fill:#98a2b3} .arra{fill:#4353ff}
  .ab{fill:#eef1ff;stroke:#c7ceff} .abt{fill:#2a3aa8} .abl{fill:#3f4b9e} .abo{fill:none;stroke:#4353ff;stroke-width:1.5}
  .ok{fill:#ecfdf3;stroke:#75e0a7} .okt{fill:#067647} .okd{fill:#12b76a}
  .bs{fill:#fffaeb;stroke:#fec84b} .bst{fill:#b54708}
  .fc{fill:#fef3f2;stroke:#fda29b} .fct{fill:#b42318} .fcd{fill:#f04438}
  .fr{fill:#fff6ed;stroke:#fd853a} .frt{fill:#c4320a}
  .mu{fill:#f2f4f7;stroke:#d0d5dd} .mud{fill:#d0d5dd}
  .dbx{fill:none;stroke:#d0d5dd;stroke-dasharray:5 4}
  .clu{fill:#4353ff;fill-opacity:.06;stroke:#4353ff;stroke-width:1.8;stroke-dasharray:6 4;stroke-linejoin:round}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161b26;stroke:#333741}
    .t{fill:#f5f5f6} .s{fill:#94969c} .h{fill:#85888e}
    .lb{fill:#ececed} .l{fill:#cecfd2} .m{fill:#94969c} .ink{fill:#ececed} .numw{fill:#161b26}
    .box{fill:#1f242f;stroke:#333741} .chip{fill:#262b36;stroke:#333741} .hd{fill:#262b36}
    .cap{fill:#262b36;stroke:#4a4f5a}
    .rule{stroke:#333741}
    .edge{stroke:#94969c} .arr{fill:#94969c}
    .dash{stroke:#61646c} .arrd{fill:#61646c}
    .acc,.accd{stroke:#8098f9} .acct,.ac{fill:#8098f9} .arra{fill:#8098f9}
    .et{fill:#94969c}
    .ab{fill:#1c2142;stroke:#3b4699} .abt{fill:#c7d0ff} .abl{fill:#a4b0f0} .abo{stroke:#8098f9}
    .ok{fill:#0b2418;stroke:#079455} .okt{fill:#75e0a7} .okd{fill:#17b26a}
    .bs{fill:#2b1d07;stroke:#ca8504} .bst{fill:#fec84b}
    .fc{fill:#2d1210;stroke:#d92d20} .fct{fill:#fda29b} .fcd{fill:#f04438}
    .fr{fill:#2b170c;stroke:#e04f16} .frt{fill:#f7b27a}
    .mu{fill:#262b36;stroke:#333741} .mud{fill:#61646c}
    .dbx{stroke:#61646c}
    .clu{fill:#8098f9;fill-opacity:.1;stroke:#8098f9}
  }
</style>
  <defs>
    <marker id="ptn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arr" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="ptd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrd" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="pta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arra" d="M 0 1 L 9 5 L 0 9 z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="919" height="559" rx="12"/>
  <text class="t" x="24" y="38">A production instance</text>
  <text class="s" x="24" y="62">One container behind an HTTPS proxy, with its data on a persistent volume or in a managed database and bucket.</text>
  <text class="h" x="22" y="94">WHO CONNECTS</text>
  <text class="h" x="262" y="94">THE EDGE</text>
  <text class="h" x="482" y="94">ONE CONTAINER</text>
  <text class="h" x="726" y="94">ITS DATA</text>

  <!-- Who connects -->
  <rect class="box" x="22" y="108" width="196" height="80" rx="8"/>
  <text class="lb" x="38" y="132">CI runners</text>
  <text class="l" x="38" y="154">the reporter, with</text>
  <text class="mono m" x="38" y="174">PIWI_API_KEY</text>
  <path class="acc" d="M 218 148 L 260 214" marker-end="url(#pta)"/>
  <rect class="box" x="22" y="200" width="196" height="62" rx="8"/>
  <text class="lb" x="38" y="224">Your team</text>
  <text class="l" x="38" y="246">browsers, signed in</text>
  <path class="acc" d="M 218 231 L 260 236" marker-end="url(#pta)"/>
  <rect class="box" x="22" y="292" width="196" height="62" rx="8"/>
  <text class="lb" x="38" y="316">Coding agents</text>
  <text class="l" x="38" y="338">MCP, with an API key</text>
  <path class="acc" d="M 218 323 L 260 258" marker-end="url(#pta)"/>
  <text class="acct" x="262" y="148">HTTPS</text>

  <!-- The edge -->
  <rect class="box" x="262" y="160" width="176" height="152" rx="8"/>
  <path class="hd" d="M 262.5 192 L 262.5 168 Q 262.5 160.5 270 160.5 L 430 160.5 Q 437.5 160.5 437.5 168 L 437.5 192 Z"/>
  <text class="lb" x="278" y="181">Reverse proxy</text>
  <text class="l" x="278" y="216">Caddy or nginx,</text>
  <text class="l" x="278" y="235">TLS on port 443</text>
  <text class="m" x="278" y="264">large uploads allowed,</text>
  <text class="m" x="278" y="281">SSE never buffered</text>
  <path class="edge" d="M 438 236 L 480 236" marker-end="url(#ptn)"/>
  <text class="et" x="460" y="226" text-anchor="middle">HTTP</text>

  <!-- The server -->
  <rect class="box" x="482" y="108" width="200" height="300" rx="8"/>
  <path class="hd" d="M 482.5 140 L 482.5 116 Q 482.5 108.5 490 108.5 L 674 108.5 Q 681.5 108.5 681.5 116 L 681.5 140 Z"/>
  <text class="lb" x="498" y="129">Piwi server</text>
  <text class="l" x="498" y="164">one replica, port 3000,</text>
  <text class="l" x="498" y="183">non-root (UID 1001)</text>
  <text class="mono m" x="498" y="208">GET /api/health</text>
  <text class="h" x="498" y="246">SET BEFORE EXPOSING</text>
  <text class="mono ink" x="498" y="270">PIWI_AUTH_ENABLED</text>
  <text class="mono ink" x="498" y="290">PIWI_AUTH_SECRET</text>
  <text class="mono ink" x="498" y="310">PIWI_SECRET_KEY</text>
  <text class="mono ink" x="498" y="330">PIWI_SETUP_TOKEN</text>
  <text class="mono ink" x="498" y="350">PIWI_SITE_URL</text>
  <text class="mono ink" x="498" y="370">PIWI_TRUST_PROXY</text>

  <!-- Its data -->
  <rect class="box" x="726" y="108" width="172" height="100" rx="8"/>
  <text class="lb" x="742" y="132">/app/.data</text>
  <text class="m" x="742" y="154">piwi.db (SQLite)</text>
  <text class="m" x="742" y="171">storage/: traces,</text>
  <text class="m" x="742" y="188">reports, attachments</text>
  <path class="edge" d="M 682 158 L 724 158" marker-end="url(#ptn)"/>
  <text class="m" x="726" y="238">or move them out:</text>
  <path class="box" d="M 726 264 a 86 12 0 0 0 172 0 v 40 a 86 12 0 0 1 -172 0 z"/>
  <ellipse class="cap" cx="812" cy="264" rx="86" ry="12"/>
  <text class="l ink" x="812" y="296" text-anchor="middle">PostgreSQL 14+</text>
  <rect class="box" x="726" y="332" width="172" height="54" rx="8"/>
  <text class="l ink" x="812" y="364" text-anchor="middle">S3-compatible bucket</text>
  <path class="dash" d="M 682 290 L 724 290" marker-end="url(#ptd)"/>
  <path class="dash" d="M 682 358 L 724 358" marker-end="url(#ptd)"/>

  <!-- Outbound -->
  <path class="dash" d="M 582 408 L 582 458" marker-end="url(#ptd)"/>
  <text class="m" x="592" y="436">outbound, only what you configure</text>
  <rect class="chip" x="22" y="460" width="205" height="40" rx="8"/>
  <text class="l" x="124.5" y="485" text-anchor="middle">SMTP: email</text>
  <rect class="chip" x="245.66666666666666" y="460" width="205" height="40" rx="8"/>
  <text class="l" x="348.16666666666663" y="485" text-anchor="middle">GitHub · GitLab · Bitbucket</text>
  <rect class="chip" x="469.3333333333333" y="460" width="205" height="40" rx="8"/>
  <text class="l" x="571.8333333333333" y="485" text-anchor="middle">an AI provider</text>
  <rect class="chip" x="693" y="460" width="205" height="40" rx="8"/>
  <text class="l" x="795.5" y="485" text-anchor="middle">Slack, Teams, webhooks</text>
  <path class="dash" d="M 124.5 448 L 795.5 448"/>
  <path class="dash" d="M 124.5 448 L 124.5 458"/>
  <path class="dash" d="M 348.16666666666663 448 L 348.16666666666663 458"/>
  <path class="dash" d="M 571.8333333333333 448 L 571.8333333333333 458"/>
  <path class="dash" d="M 795.5 448 L 795.5 458"/>
  <text class="l" x="22" y="536">Back up /app/.data, or the database and the bucket; a restore needs the same PIWI_SECRET_KEY.</text>
</svg>
