<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 454" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
  .bg{fill:#fcfcfd;stroke:#e4e7ec}
  .t{fill:#101828;font-weight:700;font-size:19px}
  .s{fill:#475467;font-size:14px}
  .h{fill:#667085;font-size:12.5px;font-weight:700;letter-spacing:.05em}
  .lb{fill:#344054;font-size:15px;font-weight:600}
  .l{fill:#475467;font-size:13.5px}
  .m{fill:#667085;font-size:12.5px}
  .b{font-weight:600}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre}
  .ink{fill:#344054} .numw{fill:#ffffff}
  .box{fill:#ffffff;stroke:#d0d5dd}
  .chip{fill:#f9fafb;stroke:#d0d5dd}
  .hd{fill:#f2f4f7}
  .cap{fill:#f2f4f7;stroke:#d0d5dd}
  .rule{fill:none;stroke:#e4e7ec}
  .edge{fill:none;stroke:#667085;stroke-width:1.4}
  .dash{fill:none;stroke:#98a2b3;stroke-width:1.3;stroke-dasharray:5 4}
  .acc{fill:none;stroke:#4353ff;stroke-width:1.6}
  .accd{fill:none;stroke:#4353ff;stroke-width:1.4;stroke-dasharray:5 4}
  .acct{fill:#4353ff;font-size:13px} .ac{fill:#4353ff}
  .et{fill:#475467;font-size:13px}
  .arr{fill:#667085} .arrd{fill:#98a2b3} .arra{fill:#4353ff}
  .ab{fill:#eef1ff;stroke:#c7ceff} .abt{fill:#2a3aa8} .abl{fill:#3f4b9e} .abo{fill:none;stroke:#4353ff;stroke-width:1.5}
  .ok{fill:#ecfdf3;stroke:#75e0a7} .okt{fill:#067647} .okd{fill:#12b76a}
  .bs{fill:#fffaeb;stroke:#fec84b} .bst{fill:#b54708}
  .fc{fill:#fef3f2;stroke:#fda29b} .fct{fill:#b42318} .fcd{fill:#f04438}
  .fr{fill:#fff6ed;stroke:#fd853a} .frt{fill:#c4320a}
  .mu{fill:#f2f4f7;stroke:#d0d5dd} .mud{fill:#d0d5dd}
  .dbx{fill:none;stroke:#d0d5dd;stroke-dasharray:5 4}
  .clu{fill:#4353ff;fill-opacity:.06;stroke:#4353ff;stroke-width:1.8;stroke-dasharray:6 4;stroke-linejoin:round}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161b26;stroke:#333741}
    .t{fill:#f5f5f6} .s{fill:#94969c} .h{fill:#85888e}
    .lb{fill:#ececed} .l{fill:#cecfd2} .m{fill:#94969c} .ink{fill:#ececed} .numw{fill:#161b26}
    .box{fill:#1f242f;stroke:#333741} .chip{fill:#262b36;stroke:#333741} .hd{fill:#262b36}
    .cap{fill:#262b36;stroke:#4a4f5a}
    .rule{stroke:#333741}
    .edge{stroke:#94969c} .arr{fill:#94969c}
    .dash{stroke:#61646c} .arrd{fill:#61646c}
    .acc,.accd{stroke:#8098f9} .acct,.ac{fill:#8098f9} .arra{fill:#8098f9}
    .et{fill:#94969c}
    .ab{fill:#1c2142;stroke:#3b4699} .abt{fill:#c7d0ff} .abl{fill:#a4b0f0} .abo{stroke:#8098f9}
    .ok{fill:#0b2418;stroke:#079455} .okt{fill:#75e0a7} .okd{fill:#17b26a}
    .bs{fill:#2b1d07;stroke:#ca8504} .bst{fill:#fec84b}
    .fc{fill:#2d1210;stroke:#d92d20} .fct{fill:#fda29b} .fcd{fill:#f04438}
    .fr{fill:#2b170c;stroke:#e04f16} .frt{fill:#f7b27a}
    .mu{fill:#262b36;stroke:#333741} .mud{fill:#61646c}
    .dbx{stroke:#61646c}
    .clu{fill:#8098f9;fill-opacity:.1;stroke:#8098f9}
  }
</style>
  <defs>
    <marker id="mpn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arr" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="mpd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrd" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="mpa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arra" d="M 0 1 L 9 5 L 0 9 z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="919" height="453" rx="12"/>
  <text class="t" x="24" y="38">The moving parts</text>
  <text class="s" x="24" y="62">The reporter runs inside your Playwright run and sends it to the server; you read it in the browser.</text>
  <text class="h" x="22" y="94">WHERE TESTS RUN</text>
  <text class="h" x="372" y="94">THE SERVER</text>
  <text class="h" x="740" y="94">WHERE YOU READ IT</text>

  <!-- Where tests run: the same reporter in both lanes -->
  <rect class="box" x="22" y="108" width="230" height="128" rx="8"/>
  <path class="hd" d="M 22.5 140 L 22.5 116 Q 22.5 108.5 30 108.5 L 244 108.5 Q 251.5 108.5 251.5 116 L 251.5 140 Z"/>
  <text class="lb" x="38" y="129">On your machine</text>
  <text class="mono ink" x="38" y="164">npx playwright test</text>
  <text class="m" x="38" y="188">the reporter runs inside it,</text>
  <text class="m" x="38" y="205">with the capture fixtures</text>
  <rect class="box" x="22" y="262" width="230" height="136" rx="8"/>
  <path class="hd" d="M 22.5 294 L 22.5 270 Q 22.5 262.5 30 262.5 L 244 262.5 Q 251.5 262.5 251.5 270 L 251.5 294 Z"/>
  <text class="lb" x="38" y="283">In CI</text>
  <text class="mono ink" x="38" y="318">npx playwright test</text>
  <text class="m" x="38" y="342">the same, pointed at it with</text>
  <text class="mono m" x="38" y="362">PIWI_DASHBOARD_URL</text>
  <text class="mono m" x="38" y="379">PIWI_API_KEY</text>
  <path class="acc" d="M 252 178 L 370 214" marker-end="url(#mpa)"/>
  <path class="acc" d="M 252 326 L 370 290" marker-end="url(#mpa)"/>
  <text class="acct" x="312" y="246" text-anchor="middle">streams results,</text>
  <text class="acct" x="312" y="263" text-anchor="middle">uploads traces</text>

  <!-- The server -->
  <rect class="box" x="372" y="108" width="300" height="290" rx="8"/>
  <path class="hd" d="M 372.5 140 L 372.5 116 Q 372.5 108.5 380 108.5 L 664 108.5 Q 671.5 108.5 671.5 116 L 671.5 140 Z"/>
  <text class="lb" x="388" y="129">Piwi server</text>
  <text class="l" x="388" y="162">one process: API and dashboard</text>
  <rect class="chip" x="388" y="178" width="268" height="84" rx="8"/>
  <text class="lb" x="404" y="202">Database</text>
  <text class="l" x="404" y="224">SQLite by default, or PostgreSQL</text>
  <text class="m" x="404" y="244">runs, test cases, clusters</text>
  <rect class="chip" x="388" y="274" width="268" height="84" rx="8"/>
  <text class="lb" x="404" y="298">Artifacts</text>
  <text class="l" x="404" y="320">traces, screenshots, videos</text>
  <text class="m" x="404" y="340">in .data/storage, or in S3</text>
  <text class="m" x="388" y="382">Docker, npx, or the desktop app</text>

  <!-- The browser -->
  <rect class="box" x="740" y="168" width="158" height="172" rx="8"/>
  <path class="hd" d="M 740.5 200 L 740.5 176 Q 740.5 168.5 748 168.5 L 890 168.5 Q 897.5 168.5 897.5 176 L 897.5 200 Z"/>
  <text class="lb" x="756" y="189">Your browser</text>
  <text class="l" x="756" y="224">the dashboard:</text>
  <text class="l" x="756" y="243">runs, failures,</text>
  <text class="l" x="756" y="262">clusters, flaky</text>
  <text class="l" x="756" y="281">tests</text>
  <text class="m" x="756" y="304">live while a run</text>
  <text class="m" x="756" y="320">streams</text>
  <path class="acc" d="M 672 252 L 738 252" marker-end="url(#mpa)"/>
  <text class="acct" x="706" y="242" text-anchor="middle">serves</text>
  <text class="l" x="22" y="430">A run appears when the suite starts and fills in as tests finish; the reporter prints a View run: link at the end.</text>
</svg>
