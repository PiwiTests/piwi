<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
  .bg{fill:#fcfcfd;stroke:#e4e7ec}
  .t{fill:#101828;font-weight:700;font-size:16px}
  .s{fill:#475467;font-size:12.5px}
  .h{fill:#667085;font-size:10.5px;font-weight:600;letter-spacing:.06em}
  .l{fill:#344054;font-size:12px}
  .lb{fill:#344054;font-size:12.5px;font-weight:600}
  .m{fill:#667085;font-size:11px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px}
  .bst,.fct,.frt,.okt{font-size:11px}
  .box{fill:#ffffff;stroke:#d0d5dd}
  .hd{fill:#f2f4f7}
  .dash{fill:none;stroke:#98a2b3;stroke-dasharray:4 3}
  .edge{fill:none;stroke:#98a2b3;stroke-width:1.3}
  .acc{fill:none;stroke:#4353ff;stroke-width:1.6}
  .acct{fill:#4353ff;font-size:11px}
  .arr{fill:#98a2b3} .arra{fill:#4353ff}
  .bs{fill:#fffaeb;stroke:#f79009} .bst{fill:#b54708}
  .fc{fill:#fef3f2;stroke:#f04438} .fct{fill:#b42318}
  .fr{fill:#fff6ed;stroke:#fb6514} .frt{fill:#c4320a}
  .ok{fill:#ecfdf3;stroke:#12b76a} .okt{fill:#067647}
  .chip{stroke-width:1}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161b26;stroke:#333741}
    .t{fill:#f5f5f6} .s{fill:#94969c} .h{fill:#85888e}
    .l,.lb{fill:#cecfd2} .m{fill:#85888e}
    .box{fill:#1f242f;stroke:#333741} .hd{fill:#262b36}
    .dash{stroke:#61646c} .edge{stroke:#61646c} .arr{fill:#61646c}
    .acc{stroke:#8098f9} .acct{fill:#8098f9} .arra{fill:#8098f9}
    .bs{fill:#2b1d07;stroke:#dc6803} .bst{fill:#fec84b}
    .fc{fill:#2d1210;stroke:#d92d20} .fct{fill:#fda29b}
    .fr{fill:#2b170c;stroke:#e04f16} .frt{fill:#f7b27a}
    .ok{fill:#0b2418;stroke:#079455} .okt{fill:#75e0a7}
  }
</style>
  <defs>
    <marker id="ucvA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arr" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="ucvB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arra" d="M 0 1 L 9 5 L 0 9 z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="919" height="299" rx="12"/>
  <text class="t" x="24" y="36">Uncovered changes</text>
  <text class="s" x="24" y="56">When a pull-request run finishes, each file it changed is joined to the tests that observably reach it.</text>
  <rect class="box chip" x="24" y="84" width="156" height="176" rx="8"/>
  <path class="hd" d="M 24.5 114 L 24.5 92 Q 24.5 84.5 32 84.5 L 172 84.5 Q 179.5 84.5 179.5 92 L 179.5 114 Z"/>
  <text class="lb" x="38" y="104">1 · A PR run</text>
  <text class="l" x="38" y="136">finishes; the diff</text>
  <text class="l" x="38" y="153">comes from the source</text>
  <text class="l" x="38" y="170">control connection</text>
  <text class="m" x="38" y="248">base: the target branch</text>
  <rect class="box chip" x="200" y="84" width="236" height="176" rx="8"/>
  <path class="hd" d="M 200.5 114 L 200.5 92 Q 200.5 84.5 208 84.5 L 428 84.5 Q 435.5 84.5 435.5 92 L 435.5 114 Z"/>
  <text class="lb" x="214" y="104">2 · Each changed file</text>
  <text class="l" x="214" y="136">is reached when a test that</text>
  <text class="l" x="214" y="153">ran recently requested its</text>
  <text class="l" x="214" y="170">route or visited its page,</text>
  <text class="l" x="214" y="187">ran a locator written in it,</text>
  <text class="l" x="214" y="204">or executed it, or a suite</text>
  <text class="l" x="214" y="221">ran one of its changed lines</text>
  <text class="m" x="214" y="248">this run, and the last 30</text>
  <rect class="ok chip" x="466" y="102" width="176" height="30" rx="7"/>
  <text class="okt" x="554.0" y="121" text-anchor="middle">reached</text>
  <path class="edge" d="M 437 172.0 C 450.5 172.0, 450.5 117, 464 117" marker-end="url(#ucvA)"/>
  <rect class="bs chip" x="466" y="158" width="176" height="30" rx="7"/>
  <text class="bst" x="554.0" y="177" text-anchor="middle">uncovered change: a gap</text>
  <path class="edge" d="M 437 172.0 C 450.5 172.0, 450.5 173, 464 173" marker-end="url(#ucvA)"/>
  <rect class="dash chip" x="466" y="214" width="176" height="30" rx="7"/>
  <text class="m" x="554.0" y="233" text-anchor="middle">not counted, with the reason</text>
  <path class="edge" d="M 437 172.0 C 450.5 172.0, 450.5 229, 464 229" marker-end="url(#ucvA)"/>
  <path class="acc" d="M 181 172.0 L 198 172.0" marker-end="url(#ucvB)"/>
  <rect class="box chip" x="670" y="84" width="226" height="176" rx="8"/>
  <path class="hd" d="M 670.5 114 L 670.5 92 Q 670.5 84.5 678 84.5 L 888 84.5 Q 895.5 84.5 895.5 92 L 895.5 114 Z"/>
  <text class="lb" x="684" y="104">3 · On the pull request</text>
  <text class="l" x="684" y="136">an Uncovered changes section:</text>
  <text class="l" x="684" y="153">the files by ticket, and the</text>
  <text class="l" x="684" y="170">changed lines no suite ran</text>
  <text class="l" x="684" y="187">piwi/tests/change-coverage,</text>
  <text class="l" x="684" y="204">always success</text>
  <text class="l" x="684" y="221">get_change_coverage for agents</text>
  <text class="m" x="684" y="248">gate flag: a warning only</text>
  <path class="acc" d="M 643 173 L 668 173" marker-end="url(#ucvB)"/>
  <text class="m" x="24" y="286">Observed reach, and the head commit’s coverage where it counts the changed lines: a reached file may still hold lines no suite ran.</text>

</svg>
