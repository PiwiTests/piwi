<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 344" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
  .bg{fill:#fcfcfd;stroke:#e4e7ec}
  .t{fill:#101828;font-weight:700;font-size:19px}
  .s{fill:#475467;font-size:14px}
  .h{fill:#667085;font-size:12.5px;font-weight:700;letter-spacing:.05em}
  .lb{fill:#344054;font-size:15px;font-weight:600}
  .l{fill:#475467;font-size:13.5px}
  .m{fill:#667085;font-size:12.5px}
  .b{font-weight:600}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre}
  .ink{fill:#344054} .numw{fill:#ffffff}
  .box{fill:#ffffff;stroke:#d0d5dd}
  .chip{fill:#f9fafb;stroke:#d0d5dd}
  .hd{fill:#f2f4f7}
  .cap{fill:#f2f4f7;stroke:#d0d5dd}
  .rule{fill:none;stroke:#e4e7ec}
  .edge{fill:none;stroke:#667085;stroke-width:1.4}
  .dash{fill:none;stroke:#98a2b3;stroke-width:1.3;stroke-dasharray:5 4}
  .acc{fill:none;stroke:#4353ff;stroke-width:1.6}
  .accd{fill:none;stroke:#4353ff;stroke-width:1.4;stroke-dasharray:5 4}
  .acct{fill:#4353ff;font-size:13px} .ac{fill:#4353ff}
  .et{fill:#475467;font-size:13px}
  .arr{fill:#667085} .arrd{fill:#98a2b3} .arra{fill:#4353ff}
  .ab{fill:#eef1ff;stroke:#c7ceff} .abt{fill:#2a3aa8} .abl{fill:#3f4b9e} .abo{fill:none;stroke:#4353ff;stroke-width:1.5}
  .ok{fill:#ecfdf3;stroke:#75e0a7} .okt{fill:#067647} .okd{fill:#12b76a}
  .bs{fill:#fffaeb;stroke:#fec84b} .bst{fill:#b54708}
  .fc{fill:#fef3f2;stroke:#fda29b} .fct{fill:#b42318} .fcd{fill:#f04438}
  .fr{fill:#fff6ed;stroke:#fd853a} .frt{fill:#c4320a}
  .mu{fill:#f2f4f7;stroke:#d0d5dd} .mud{fill:#d0d5dd}
  .dbx{fill:none;stroke:#d0d5dd;stroke-dasharray:5 4}
  .clu{fill:#4353ff;fill-opacity:.06;stroke:#4353ff;stroke-width:1.8;stroke-dasharray:6 4;stroke-linejoin:round}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161b26;stroke:#333741}
    .t{fill:#f5f5f6} .s{fill:#94969c} .h{fill:#85888e}
    .lb{fill:#ececed} .l{fill:#cecfd2} .m{fill:#94969c} .ink{fill:#ececed} .numw{fill:#161b26}
    .box{fill:#1f242f;stroke:#333741} .chip{fill:#262b36;stroke:#333741} .hd{fill:#262b36}
    .cap{fill:#262b36;stroke:#4a4f5a}
    .rule{stroke:#333741}
    .edge{stroke:#94969c} .arr{fill:#94969c}
    .dash{stroke:#61646c} .arrd{fill:#61646c}
    .acc,.accd{stroke:#8098f9} .acct,.ac{fill:#8098f9} .arra{fill:#8098f9}
    .et{fill:#94969c}
    .ab{fill:#1c2142;stroke:#3b4699} .abt{fill:#c7d0ff} .abl{fill:#a4b0f0} .abo{stroke:#8098f9}
    .ok{fill:#0b2418;stroke:#079455} .okt{fill:#75e0a7} .okd{fill:#17b26a}
    .bs{fill:#2b1d07;stroke:#ca8504} .bst{fill:#fec84b}
    .fc{fill:#2d1210;stroke:#d92d20} .fct{fill:#fda29b} .fcd{fill:#f04438}
    .fr{fill:#2b170c;stroke:#e04f16} .frt{fill:#f7b27a}
    .mu{fill:#262b36;stroke:#333741} .mud{fill:#61646c}
    .dbx{stroke:#61646c}
    .clu{fill:#8098f9;fill-opacity:.1;stroke:#8098f9}
  }
</style>
  <defs>
    <marker id="ucvn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arr" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="ucvd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrd" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="ucva" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arra" d="M 0 1 L 9 5 L 0 9 z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="919" height="343" rx="12"/>
  <text class="t" x="24" y="38">Uncovered changes</text>
  <text class="s" x="24" y="62">When a pull-request run finishes, each file it changed is joined to the tests that observably reach it.</text>

  <!-- The run -->
  <rect class="box" x="22" y="88" width="172" height="200" rx="8"/>
  <path class="hd" d="M 22.5 120 L 22.5 96 Q 22.5 88.5 30 88.5 L 186 88.5 Q 193.5 88.5 193.5 96 L 193.5 120 Z"/>
  <text class="lb" x="38" y="109">1 · A PR run</text>
  <text class="l" x="38" y="144">finishes; the diff</text>
  <text class="l" x="38" y="163">comes from the source</text>
  <text class="l" x="38" y="182">control connection</text>
  <text class="m" x="38" y="255">base: the target</text>
  <text class="m" x="38" y="271">branch</text>
  <path class="acc" d="M 194 192 L 210 192" marker-end="url(#ucva)"/>

  <!-- Each changed file -->
  <rect class="box" x="212" y="88" width="246" height="200" rx="8"/>
  <path class="hd" d="M 212.5 120 L 212.5 96 Q 212.5 88.5 220 88.5 L 450 88.5 Q 457.5 88.5 457.5 96 L 457.5 120 Z"/>
  <text class="lb" x="228" y="109">2 · Each changed file</text>
  <text class="l" x="228" y="144">is reached when a test that</text>
  <text class="l" x="228" y="163">ran recently requested its</text>
  <text class="l" x="228" y="182">route or visited its page,</text>
  <text class="l" x="228" y="201">ran a locator written in it,</text>
  <text class="l" x="228" y="220">or executed it, or a suite</text>
  <text class="l" x="228" y="239">ran one of its changed lines</text>
  <text class="m" x="228" y="272">this run, and the last 30</text>

  <!-- Outcomes -->
  <rect class="ok" x="486" y="102" width="164" height="32" rx="7"/>
  <text class="l okt" x="568" y="122.5" text-anchor="middle">reached</text>
  <path class="edge" d="M 458 192 C 472 192, 470 118, 484 118" marker-end="url(#ucvn)"/>
  <rect class="bs" x="486" y="169" width="164" height="46" rx="7"/>
  <text class="l bst" x="568" y="188.5" text-anchor="middle">uncovered change:</text>
  <text class="l bst" x="568" y="205.5" text-anchor="middle">a gap</text>
  <path class="edge" d="M 458 192 C 472 192, 470 192, 484 192" marker-end="url(#ucvn)"/>
  <rect class="dbx" x="486" y="235" width="164" height="46" rx="7"/>
  <text class="l m" x="568" y="254.5" text-anchor="middle">not counted,</text>
  <text class="l m" x="568" y="271.5" text-anchor="middle">with the reason</text>
  <path class="edge" d="M 458 192 C 472 192, 470 258, 484 258" marker-end="url(#ucvn)"/>
  <path class="acc" d="M 650 192 L 674 192" marker-end="url(#ucva)"/>

  <!-- On the pull request -->
  <rect class="box" x="676" y="88" width="222" height="200" rx="8"/>
  <path class="hd" d="M 676.5 120 L 676.5 96 Q 676.5 88.5 684 88.5 L 890 88.5 Q 897.5 88.5 897.5 96 L 897.5 120 Z"/>
  <text class="lb" x="692" y="109">3 · On the pull request</text>
  <text class="l" x="692" y="144">an Uncovered changes section:</text>
  <text class="l" x="692" y="163">files by ticket, and changed</text>
  <text class="l" x="692" y="182">lines no suite ran</text>
  <text class="l" x="692" y="206">piwi/tests/change-coverage,</text>
  <text class="l" x="692" y="225">always success</text>
  <text class="l" x="692" y="250">agents: get_change_coverage</text>
  <text class="m" x="692" y="272">gate flag: a warning only</text>
  <text class="l" x="22" y="320">Observed reach, and the head commit’s coverage where it counts the changed lines: a reached file may still hold lines no suite ran.</text>
</svg>
