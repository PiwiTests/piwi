<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 626" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
  .bg{fill:#fcfcfd;stroke:#e4e7ec}
  .t{fill:#101828;font-weight:700;font-size:19px}
  .s{fill:#475467;font-size:14px}
  .h{fill:#667085;font-size:12.5px;font-weight:700;letter-spacing:.05em}
  .lb{fill:#344054;font-size:15px;font-weight:600}
  .l{fill:#475467;font-size:13.5px}
  .m{fill:#667085;font-size:12.5px}
  .b{font-weight:600}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre}
  .ink{fill:#344054} .numw{fill:#ffffff}
  .box{fill:#ffffff;stroke:#d0d5dd}
  .chip{fill:#f9fafb;stroke:#d0d5dd}
  .hd{fill:#f2f4f7}
  .cap{fill:#f2f4f7;stroke:#d0d5dd}
  .rule{fill:none;stroke:#e4e7ec}
  .edge{fill:none;stroke:#667085;stroke-width:1.4}
  .dash{fill:none;stroke:#98a2b3;stroke-width:1.3;stroke-dasharray:5 4}
  .acc{fill:none;stroke:#4353ff;stroke-width:1.6}
  .accd{fill:none;stroke:#4353ff;stroke-width:1.4;stroke-dasharray:5 4}
  .acct{fill:#4353ff;font-size:13px} .ac{fill:#4353ff}
  .et{fill:#475467;font-size:13px}
  .arr{fill:#667085} .arrd{fill:#98a2b3} .arra{fill:#4353ff}
  .ab{fill:#eef1ff;stroke:#c7ceff} .abt{fill:#2a3aa8} .abl{fill:#3f4b9e} .abo{fill:none;stroke:#4353ff;stroke-width:1.5}
  .ok{fill:#ecfdf3;stroke:#75e0a7} .okt{fill:#067647} .okd{fill:#12b76a}
  .bs{fill:#fffaeb;stroke:#fec84b} .bst{fill:#b54708}
  .fc{fill:#fef3f2;stroke:#fda29b} .fct{fill:#b42318} .fcd{fill:#f04438}
  .fr{fill:#fff6ed;stroke:#fd853a} .frt{fill:#c4320a}
  .mu{fill:#f2f4f7;stroke:#d0d5dd} .mud{fill:#d0d5dd}
  .dbx{fill:none;stroke:#d0d5dd;stroke-dasharray:5 4}
  .clu{fill:#4353ff;fill-opacity:.06;stroke:#4353ff;stroke-width:1.8;stroke-dasharray:6 4;stroke-linejoin:round}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161b26;stroke:#333741}
    .t{fill:#f5f5f6} .s{fill:#94969c} .h{fill:#85888e}
    .lb{fill:#ececed} .l{fill:#cecfd2} .m{fill:#94969c} .ink{fill:#ececed} .numw{fill:#161b26}
    .box{fill:#1f242f;stroke:#333741} .chip{fill:#262b36;stroke:#333741} .hd{fill:#262b36}
    .cap{fill:#262b36;stroke:#4a4f5a}
    .rule{stroke:#333741}
    .edge{stroke:#94969c} .arr{fill:#94969c}
    .dash{stroke:#61646c} .arrd{fill:#61646c}
    .acc,.accd{stroke:#8098f9} .acct,.ac{fill:#8098f9} .arra{fill:#8098f9}
    .et{fill:#94969c}
    .ab{fill:#1c2142;stroke:#3b4699} .abt{fill:#c7d0ff} .abl{fill:#a4b0f0} .abo{stroke:#8098f9}
    .ok{fill:#0b2418;stroke:#079455} .okt{fill:#75e0a7} .okd{fill:#17b26a}
    .bs{fill:#2b1d07;stroke:#ca8504} .bst{fill:#fec84b}
    .fc{fill:#2d1210;stroke:#d92d20} .fct{fill:#fda29b} .fcd{fill:#f04438}
    .fr{fill:#2b170c;stroke:#e04f16} .frt{fill:#f7b27a}
    .mu{fill:#262b36;stroke:#333741} .mud{fill:#61646c}
    .dbx{stroke:#61646c}
    .clu{fill:#8098f9;fill-opacity:.1;stroke:#8098f9}
  }
</style>
  <defs>
    <marker id="bln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arr" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="bld" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrd" d="M 0 1 L 9 5 L 0 9 z"/></marker>
    <marker id="bla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arra" d="M 0 1 L 9 5 L 0 9 z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="919" height="625" rx="12"/>
  <text class="t" x="24" y="38">How the baseline is chosen</text>
  <text class="s" x="24" y="62">Each rung takes the most recent earlier passing run; the first rung that has one wins. Example: a staging run on feature/x.</text>
  <text class="h" x="248" y="100">BRANCH</text>
  <text class="h" x="406" y="100">EXAMPLE</text>
  <text class="h" x="536" y="100">WHY</text>

  <!-- Within the run’s environment -->
  <path class="edge" d="M 176 116 L 168 116 L 168 262 L 176 262"/>
  <text class="lb" x="22" y="181">Same</text>
  <text class="lb" x="22" y="200">environment</text>
  <text class="mono m" x="22" y="223">staging</text>
  <rect class="ab" x="196" y="112" width="702" height="46" rx="8"/>
  <circle class="arra" cx="220" cy="135" r="12"/>
  <text class="m b numw" x="220" y="139.5" text-anchor="middle">1</text>
  <text class="lb abt" x="248" y="140">Same branch</text>
  <text class="mono ink" x="406" y="140">feature/x</text>
  <text class="m" x="536" y="140">the branch’s own history</text>
  <rect class="box" x="196" y="166" width="702" height="46" rx="8"/>
  <circle class="cap" cx="220" cy="189" r="12"/>
  <text class="m b ink" x="220" y="193.5" text-anchor="middle">2</text>
  <text class="lb" x="248" y="194">Base branch</text>
  <text class="mono ink" x="406" y="194">main</text>
  <text class="m" x="536" y="194">the pull request’s target, else the default branch</text>
  <rect class="box" x="196" y="220" width="702" height="46" rx="8"/>
  <circle class="cap" cx="220" cy="243" r="12"/>
  <text class="m b ink" x="220" y="247.5" text-anchor="middle">3</text>
  <text class="lb" x="248" y="248">Any branch</text>
  <text class="mono ink" x="406" y="248">any</text>
  <text class="m" x="536" y="248">so a baseline exists whenever one does</text>

  <!-- Then in any environment -->
  <path class="edge" d="M 176 300 L 168 300 L 168 446 L 176 446"/>
  <text class="lb" x="22" y="365">Any</text>
  <text class="lb" x="22" y="384">environment</text>
  <text class="mono m" x="22" y="407">any</text>
  <rect class="box" x="196" y="296" width="702" height="46" rx="8"/>
  <circle class="cap" cx="220" cy="319" r="12"/>
  <text class="m b ink" x="220" y="323.5" text-anchor="middle">4</text>
  <text class="lb" x="248" y="324">Same branch</text>
  <text class="mono ink" x="406" y="324">feature/x</text>
  <text class="m" x="536" y="324">the branch’s own history</text>
  <rect class="box" x="196" y="350" width="702" height="46" rx="8"/>
  <circle class="cap" cx="220" cy="373" r="12"/>
  <text class="m b ink" x="220" y="377.5" text-anchor="middle">5</text>
  <text class="lb" x="248" y="378">Base branch</text>
  <text class="mono ink" x="406" y="378">main</text>
  <text class="m" x="536" y="378">the pull request’s target, else the default branch</text>
  <rect class="box" x="196" y="404" width="702" height="46" rx="8"/>
  <circle class="cap" cx="220" cy="427" r="12"/>
  <text class="m b ink" x="220" y="431.5" text-anchor="middle">6</text>
  <text class="lb" x="248" y="432">Any branch</text>
  <text class="mono ink" x="406" y="432">any</text>
  <text class="m" x="536" y="432">so a baseline exists whenever one does</text>

  <!-- The failed-run fallback -->
  <rect class="dbx" x="196" y="486" width="702" height="62" rx="8"/>
  <text class="l ink" x="216" y="512">No earlier run passed? The same six rungs, for the last failed run.</text>
  <text class="m" x="216" y="532">Changes tab and get_run_insights only; the CI gate, PR feedback and regression signals never take it.</text>
  <text class="l" x="22" y="584">A run with no environment label walks rungs 4 to 6; a run whose branch is unknown has only the any-branch rungs.</text>
  <text class="l" x="22" y="604">Probe and Flake Lab runs never count, and the Changes tab compares full runs only.</text>
</svg>
