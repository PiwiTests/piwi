[package]
name = "piwi-desktop"
version = "0.51.0" # x-release-please-version
description = "Piwi Dashboard desktop app"
authors = ["piwitests"]
license = "FSL-1.1-MIT"
repository = "https://github.com/PiwiTests/platform"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "piwi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` compiles the webview inspector into release builds too (it is
# always on in debug builds). It stays dormant unless the app is launched with
# `--devtools` or `PIWI_DEBUG` set — see `run()` in src/lib.rs — so a normal
# shipped launch is unchanged, but a user chasing a bug can open the inspector.
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
# Only compiled into e2e test builds (see the `e2e-testing` feature). Lets a
# Playwright runner drive the real webview to smoke-test the shell integration.
tauri-plugin-playwright = { version = "0.4", optional = true }

# Windows-only: the taskbar thumbnail toolbar (Stop/Open buttons under the
# taskbar-button thumbnail) needs ITaskbarList3 plus a window subclass to receive
# the button clicks, the graceful stop of a local run raises Ctrl+C on the
# run's console (Win32_System_Console, see src/interrupt.rs), and an update waits
# for the server sidecar to exit before the installer runs (Win32_System_Threading,
# see `kill_server` in src/lib.rs). Pinned to the same `windows` version Tauri already resolves
# so the `HWND` returned by `WebviewWindow::hwnd()` is the same type (one shared
# copy of the crate), and so nothing extra is pulled in.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Build with `--features e2e-testing` for Playwright end-to-end tests. Pulls in
# the playwright control plugin and Tauri's runtime-ACL support so the capability
# it needs can be added only in test builds — never in shipped installers.
e2e-testing = ["dep:tauri-plugin-playwright", "tauri/dynamic-acl"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
