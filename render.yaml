# Piwi Dashboard — one-click deploy. Docs: https://piwitests.dev/operate/one-click-deploy
# Tracks :latest. Pin a version tag before you rely on it — migrations are forward-only.

services:
  - type: web
    name: piwi
    runtime: image
    image:
      url: docker.io/phenx/piwitests-server:latest
    plan: starter
    region: oregon
    autoDeploy: false
    healthCheckPath: /api/health
    disk:
      name: piwi-data
      mountPath: /app/.data
      sizeGB: 10
    envVars:
      # A one-click deploy is reachable from the internet — authentication stays on.
      - key: PIWI_AUTH_ENABLED
        value: 'true'
      - key: PIWI_AUTH_SECRET
        generateValue: true
      - key: PIWI_SECRET_KEY
        generateValue: true
      # The first-admin form asks for this value, so only you can create the administrator.
      - key: PIWI_SETUP_TOKEN
        generateValue: true
